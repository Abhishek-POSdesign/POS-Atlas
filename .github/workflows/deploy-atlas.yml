name: Deploy Atlas to MilesWeb

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine target path based on branch
        id: determine_path
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "TARGET_DIR=atlas.abhisheksikka.com/" >> $GITHUB_ENV
          else
            echo "TARGET_DIR=atlas.abhisheksikka.com/${{ github.ref_name }}/" >> $GITHUB_ENV
          fi

      - name: Deploy to MilesWeb
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MILESWEB_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: "103.191.209.159"
          REMOTE_USER: "abhishek2"
          REMOTE_PORT: "22"
          SOURCE: "Deploy/"
          TARGET: ${{ env.TARGET_DIR }}
          ARGS: "-rltgoDzvO --delete"
