                                                </div>
                                            </div>
                                            <!-- Day-type toggle (Round 2 build, item 5). Three chips:
                                                 Workout / Active recovery / Full rest. Only the Workout
                                                 chip surfaces the metric form; the other two are
                                                 one-tap-and-done with their own calm treatment. -->
                                            <div class="wo-daytype-group" role="tablist">
                                                <button class="wo-daytype-chip" data-type="workout" :aria-pressed="workoutDayType === 'workout'" @click="setWorkoutDayType('workout')">
                                                    <span class="wo-daytype-icon">
                                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v16M18 4v16M4 8h4M4 16h4M16 8h4M16 16h4"/></svg>
                                                    </span>
                                                    Workout
                                                </button>
                                                <button class="wo-daytype-chip" data-type="recovery" :aria-pressed="workoutDayType === 'active_recovery'" @click="setWorkoutDayType('active_recovery')">
                                                    <span class="wo-daytype-icon">
                                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
                                                    </span>
                                                    Recovery
                                                </button>
                                                <button class="wo-daytype-chip" data-type="rest" :aria-pressed="workoutDayType === 'full_rest'" @click="setWorkoutDayType('full_rest')">
                                                    <span class="wo-daytype-icon">
                                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                                                    </span>
                                                    Full rest
                                                </button>
                                            </div>

                                            <!-- Unset (no day-type picked yet) -->
                                            <template x-if="!workoutDayType">
                                                <div class="nodata">
                                                    <span class="h">No workout day-type picked</span>
                                                    <span class="p">Tap one of the three chips above to mark today.</span>
                                                </div>
                                            </template>

                                            <!-- Today's sessions: primary focus, sits right under the toggle
                                                 (Comet review -- was below the targets grid, backwards from
                                                 what actually gets looked at first). Handles loading, empty,
                                                 and data states. -->
                                            <template x-if="workoutDayType === 'workout'">
                                                <div class="stack">
                                                    <div class="hp-microlabel">Today's sessions</div>

                                                    <!-- Loading state -->
                                                    <template x-if="workoutSessionsLoading">
                                                        <div class="nodata">
                                                            <span class="h">Loading sessions...</span>
                                                        </div>
                                                    </template>

                                                    <!-- Empty state -->
                                                    <template x-if="!workoutSessionsLoading && !hasWorkoutData">
                                                        <div class="nodata">
                                                            <div class="empty-cue-workout">
                                                                <svg width="24" height="8" viewBox="0 0 24 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                                                                    <path d="M2 4h20" class="track-line" />
                                                                    <circle cx="12" cy="4" r="3" class="track-dot" fill="currentColor" stroke="none" />
                                                                </svg>
                                                            </div>
                                                            <span class="h">Workout day · no details yet</span>
                                                            <span class="p">Tap <strong>Log details</strong> above, or wait for the auto-parse from your workout-app screenshot (planned).</span>
                                                        </div>
                                                    </template>

                                                    <!-- Data state -->
                                                    <template x-if="!workoutSessionsLoading && hasWorkoutData">
                                                        <div class="stack">
                                                            <!-- Session pills sit in a shared recessed track, same
                                                                 two-layer depth system as the Sleep note chips /
                                                                 Workout day-type toggle (follow-up polish pass). Each
                                                                 row gets a muted per-activity-type icon -- not colour-
                                                                 coded, matching the app-wide "no colored left bars"
                                                                 rule. -->
                                                            <template x-if="workoutSessions.length > 0">
                                                                <div class="wo-session-stack">
                                                                    <template x-for="session in workoutSessions" :key="session.id">
                                                                        <div class="wo-session-row">
                                                                            <div class="wo-session-info">
                                                                                <div class="wo-session-head">
                                                                                    <span class="wo-session-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x-html="sessionIconSvg(session.activity_type)"></svg></span>
                                                                                    <span class="wo-session-type" x-text="session.activity_type.replace('_', ' ')"></span>
                                                                                </div>
                                                                                <div class="wo-session-meta">
                                                                                    <span x-text="session.duration_minutes + ' min'"></span>
                                                                                    <template x-if="session.activity_type === 'strength' && session.intensity">
                                                                                        <span x-text="' · ' + session.intensity"></span>
                                                                                    </template>
                                                                                    <template x-if="session.program_tag">
                                                                                        <span x-text="' · ' + session.program_tag"></span>
                                                                                    </template>
                                                                                </div>
                                                                                <template x-if="session.note">
                                                                                    <div class="wo-session-note" x-text="session.note"></div>
                                                                                </template>
                                                                            </div>
                                                                            <!-- Consolidated session control (Comet review) -- one
                                                                                 tight icon-button group replaces two spaced text
                                                                                 links. Same underlying actions/handlers, unchanged. -->
                                                                            <div class="wo-session-actions-v2">
                                                                                <button class="wo-icon-btn" @click="openWorkoutSessionForm(session)" title="Edit session" aria-label="Edit session">
                                                                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                                                                                </button>
                                                                                <button class="wo-icon-btn danger" @click="deleteWorkoutSession(session.id)" title="Delete session" aria-label="Delete session">
                                                                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                                                                                </button>
                                                                            </div>
                                                                        </div>
                                                                    </template>
                                                                </div>
                                                            </template>
                                                            <template x-if="workoutSessions.length === 0 && workoutEntry && workoutEntry.duration_minutes != null">
                                                                <div class="metric-grid">
                                                                    <div class="metric"><span class="v" x-text="workoutEntry.workout_score ?? '—'"></span><span class="l">Score</span></div>
                                                                    <div class="metric"><span class="v" x-text="workoutEntry.workout_type || '—'"></span><span class="l">Type</span></div>
                                                                    <div class="metric"><span class="v" x-text="workoutEntry.duration_minutes != null ? workoutEntry.duration_minutes+'m' : '—'"></span><span class="l">Minutes</span></div>
                                                                    <div class="metric"><span class="v" x-text="workoutEntry.calories ?? '—'"></span><span class="l">Calories</span></div>
                                                                    <div class="metric"><span class="v" x-text="workoutEntry.vo2_max ?? '—'"></span><span class="l">VO2 max</span></div>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>

                                            <!-- Active recovery: calm lilac pulse -->
                                            <template x-if="workoutDayType === 'active_recovery'">
                                                <div class="wo-state">
                                                    <div class="wo-recovery-animation" aria-hidden="true">
                                                        <span class="wo-recovery-dot"></span>
                                                        <span class="wo-recovery-dot"></span>
                                                        <span class="wo-recovery-dot"></span>
                                                    </div>
                                                    <div class="wo-state-label">Active recovery day</div>
                                                    <div class="wo-state-sub">Logged — no details to enter.</div>
                                                </div>
                                            </template>

                                            <!-- Full rest: pulsing moon -->
                                            <template x-if="workoutDayType === 'full_rest'">
                                                <div class="wo-state">
                                                    <div class="wo-rest-icon" aria-hidden="true">
                                                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                                                    </div>
                                                    <div class="wo-state-label">Full rest day</div>
                                                    <div class="wo-state-sub">Nothing to log. Sleep well tonight.</div>
                                                </div>
                                            </template>

                                            <!-- This week's targets: demoted below sessions, quiet summary
                                                 strip (Comet review -- was above sessions, competing with them). -->
                                            <template x-if="workoutTargets.length > 0">
                                                <div class="health-targets-strip">
                                                    <div class="hp-microlabel">This week</div>
                                                    <div class="wo-targets-grid">
                                                        <template x-for="row in weeklyProgress" :key="row.type">
                                                            <div class="wo-targets-row">
                                                                <span class="wo-targets-label" x-text="row.type.replace('_', ' ')"></span>
                                                                <span class="wo-targets-dots">
                                                                    <template x-for="(dot, i) in row.dots" :key="i">
                                                                        <span class="wo-dot" :class="'wo-dot--' + dot"></span>
                                                                    </template>
                                                                </span>
                                                                <span class="wo-targets-frac" x-text="row.actual + '/' + row.target"></span>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>

                                            <!-- 4-week consistency: aggregated weekly strip (Comet review,
                                                 Option A) -- one cell per week instead of a dot per
                                                 activity-type per week. Legend right-aligned on the caption
                                                 line (follow-up polish pass), mirroring how "Avg" sits next
                                                 to "14-DAY TREND" on the Sleep panel. -->
                                            <div class="health-trend">
                                                <div class="health-trend-head">
                                                    <span class="health-trend-title">4-week consistency</span>
                                                    <div class="health-legend" x-show="workoutWeekAggregate.length > 0">
                                                        <span><span class="d d--met"></span>Met</span>
                                                        <span><span class="d d--partial"></span>Partial</span>
                                                        <span><span class="d d--missed"></span>Missed</span>
                                                    </div>
                                                </div>
                                                <template x-if="workoutWeekAggregate.length > 0">
                                                    <div class="health-weeks-strip">
                                                        <template x-for="week in workoutWeekAggregate" :key="week.label">
                                                            <div class="health-week-cell">
                                                                <div class="box" :class="'box--' + week.state"></div>
                                                                <span class="lbl" x-text="week.label"></span>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>
                                                <template x-if="workoutWeekAggregate.length === 0">
                                                    <p class="health-trend-empty">Set weekly targets to track consistency.</p>
                                                </template>
                                            </div>

                                            <div class="health-attach-row">
                                                <button type="button" class="health-attach-link" disabled title="Coming soon — AI screenshot parsing is planned">
                                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                                                    Attach screenshot <span class="future-tag">(future AI)</span>
                                                </button>
                                            </div>
                                        </div>
                                </div>

                                <!-- Routine: checklist only -->
                                <div x-data="checklistPage()">
                                    <div class="card panel">
                                        <div class="panel-head">
                                            <h2 style="margin:0;">Routine</h2>
                                            <button class="btn-text" @click="toggleManaging()" x-text="managing ? 'Done managing' : 'Manage items'"></button>
                                        </div>
                                        <div class="field-error" x-show="errorMsg" x-text="errorMsg"></div>
                                        <template x-if="loading"><p>Loading…</p></template>
                                        <template x-if="!loading">
                                            <div class="stack">
                                                <template x-for="block in blocks" :key="block.key">
                                                    <div class="cl-block" :class="'color-' + block.colorKey + (collapsedBlocks[block.key] ? ' collapsed' : '')" x-show="itemsForBlock(block.key).length > 0 || managing">
                                                        <div class="cl-block-header" @click="toggleBlock(block.key)">
                                                            <span class="cl-block-icon" x-text="block.icon"></span>
                                                            <span class="cl-block-title" x-text="block.label"></span>
                                                            <div class="cl-block-stats">
                                                                <span class="cl-block-count" x-text="`${doneCountForBlock(block.key)}/${itemsForBlock(block.key).length}`"></span>
                                                                <div class="cl-mini-dots">
                                                                    <template x-for="item in itemsForBlock(block.key)" :key="item.id">
                                                                        <span class="cl-mini-dot" :class="statusFor(item)==='done' ? 'done' : (statusFor(item) ? 'skip' : 'pending')" :title="item.name"></span>
                                                                    </template>
                                                                </div>
                                                                <div class="cl-mini-bar"><div class="cl-mini-fill" :class="'color-' + block.colorKey" :style="`width:${blockProgress(block.key)}%`"></div></div>
                                                                <span class="cl-chevron">▼</span>
                                                            </div>
                                                        </div>

                                                        <div class="cl-block-body">
                                                            <template x-for="item in itemsForBlock(block.key)" :key="item.id">
                                                                <div class="ck-row" :class="statusFor(item)==='done' ? 'is-done' : (statusFor(item)==='skipped' ? 'is-skipped' : '')">
                                                                    <template x-if="editingItemId !== item.id">
                                                                        <div class="ck-row-main">
                                                                            <div class="ck-icon" x-text="item.icon || '📋'"></div>
                                                                            <div class="ck-info"><div class="ck-title" x-text="item.name"></div></div>
                                                                            <template x-if="!managing">
                                                                                <div class="ck-row-actions">
                                                                                    <span class="ck-status" :class="'ck-status-' + (statusFor(item) || 'pending')" x-text="statusLabel(item)"></span>
                                                                                    <button class="ck-log-btn" @click="openLog(item)">Log</button>
                                                                                </div>
                                                                            </template>
                                                                            <template x-if="managing">
                                                                                <div class="ck-row-actions">
                                                                                    <button class="icon-button" @click="moveItem(item,'up')" title="Move up">↑</button>
                                                                                    <button class="icon-button" @click="moveItem(item,'down')" title="Move down">↓</button>
                                                                                    <button class="btn-text" @click="startEditItem(item)">Edit</button>
                                                                                    <button class="btn-text" style="color: var(--accent-coral)" @click="archiveItem(item)">Archive</button>
                                                                                </div>
                                                                            </template>
                                                                        </div>
                                                                    </template>
                                                                    <template x-if="editingItemId === item.id">
                                                                        <div class="ck-edit-form">
                                                                            <div class="field"><label>Name</label><input type="text" x-model="editForm.name"></div>
                                                                            <div class="field">
                                                                                <label>Block</label>
                                                                                <select x-model="editForm.block">
                                                                                    <template x-for="b in blocks" :key="b.key"><option :value="b.key" x-text="b.label"></option></template>
                                                                                </select>
                                                                            </div>
                                                                            <div class="field"><label>Icon (optional)</label><input type="text" x-model="editForm.icon" maxlength="4"></div>
                                                                            <div class="field">
                                                                                <label>Days (leave all off for every day)</label>
                                                                                <div class="day-picker">
                                                                                    <template x-for="(d, idx) in dayNames" :key="idx">
                                                                                        <button type="button" class="day-chip" :class="{active: editForm.days.includes(idx)}" @click="toggleEditDay(idx)" x-text="d"></button>
                                                                                    </template>
                                                                                </div>
                                                                            </div>
                                                                            <div class="modal-actions">
                                                                                <button class="btn-text" @click="cancelEditItem()">Cancel</button>
                                                                                <button class="btn btn-primary" @click="saveEditItem(item)">Save</button>
                                                                            </div>
                                                                        </div>
                                                                    </template>
                                                                </div>
                                                            </template>

                                                            <template x-if="managing && addingToBlock !== block.key">
                                                                <button class="btn-text" @click="openAdd(block.key)">+ Add item</button>
                                                            </template>
                                                            <template x-if="managing && addingToBlock === block.key">
                                                                <div class="card-nested" style="padding: var(--pad-sm) var(--pad-md);">
                                                                    <div class="field"><input type="text" x-model="addForm.name" placeholder="Item name" @keydown.enter="submitAdd()"></div>
                                                                    <div class="field"><input type="text" x-model="addForm.icon" placeholder="Icon (optional)" maxlength="4"></div>
                                                                    <div class="field">
                                                                        <label>Days (leave all off for every day)</label>
                                                                        <div class="day-picker">
                                                                            <template x-for="(d, idx) in dayNames" :key="idx">
                                                                                <button type="button" class="day-chip" :class="{active: addForm.days.includes(idx)}" @click="toggleAddDay(idx)" x-text="d"></button>
                                                                            </template>
                                                                        </div>
                                                                    </div>
                                                                    <div class="modal-actions">
                                                                        <button class="btn-text" @click="cancelAdd()">Cancel</button>
                                                                        <button class="btn btn-primary" @click="submitAdd()">Add</button>
                                                                    </div>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                    </div>

                                    <!-- Log popup: time + optional note, then Done / Skip / Holiday / Undo -->
                                    <template x-if="logItem">
                                        <div class="modal-overlay" @click.self="closeLog()">
                                            <div class="modal">
                                                <h2 x-text="logItem.name"></h2>
                                                <p class="system-text" x-text="'Currently: ' + statusLabel(logItem)"></p>
                                                <div class="field">
                                                    <label>Time</label>
                                                    <div class="tp-numeric" x-data="timePicker12h" x-modelable="value" x-model="logForm.time">
                                                        <select :value="hh" @change="updateHH($event.target.value)" aria-label="Hour"><option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option><option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option></select><span class="colon">:</span><select :value="mm" @change="updateMM($event.target.value)" aria-label="Minute"><option value="00">00</option><option value="15">15</option><option value="30">30</option><option value="45">45</option></select><div class="tp-ampm" role="group" aria-label="AM or PM"><button type="button" @click.prevent="updateAMPM('AM')" :aria-pressed="ampm === 'AM'">AM</button><button type="button" @click.prevent="updateAMPM('PM')" :aria-pressed="ampm === 'PM'">PM</button></div>
                                                    </div>
                                                </div>
                                                <div class="field">
                                                    <label>Note (optional)</label>
                                                    <input type="text" x-model="logForm.note" placeholder="Optional note...">
                                                </div>
                                                <div class="modal-actions" style="flex-wrap: wrap;">
                                                    <button class="btn btn-primary" style="flex:1;" @click="confirmLog('done')">✓ Done</button>
                                                    <button class="btn" style="flex:1;" @click="confirmLog('skipped')">Skip</button>
                                                    <button class="btn" style="flex:1;" @click="confirmLog('holiday')">🏖️ Holiday</button>
                                                </div>
                                                <div class="modal-actions">
                                                    <button class="btn-text" @click="closeLog()">Cancel</button>
                                                    <button class="btn btn-danger" @click="clearLog()">Undo / Clear</button>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </div>

                                <!-- Checklist Completion trend -->
                                <div class="card workspace-section">
                                    <h2>Checklist Completion</h2>
                                    <div class="trend-legend">
                                        <span><span class="trend-dot trend-done"></span>Done</span>
                                        <span><span class="trend-dot trend-skipped"></span>Skipped</span>
                                        <span><span class="trend-dot trend-missed"></span>Missed</span>
                                    </div>
                                    <div class="trend-chart">
                                        <template x-for="d in trendDays" :key="d.date">
                                            <div class="trend-col" :title="`${d.date} — ${d.done} done, ${d.skipped} skipped, ${d.missed} missed`">
                                                <div class="trend-bar">
                                                    <div class="trend-seg trend-missed" :style="`height:${d.missed/d.total*100}%`"></div>
                                                    <div class="trend-seg trend-skipped" :style="`height:${d.skipped/d.total*100}%`"></div>
                                                    <div class="trend-seg trend-done" :style="`height:${d.done/d.total*100}%`"></div>
                                                </div>
                                                <span class="trend-label" x-text="d.label"></span>
                                            </div>
                                        </template>
                                    </div>
                                </div>

                            </div>
                        </template>

                        <!-- Task modal (add + edit both use this). Tiered layout:
                             eyebrow (identity) + name-as-title + status pill,
                             Schedule subsection, Assignment subsection, actions
                             row with Delete bottom-left and Cancel/Save right.
                             (Round 2 build, item 13.) -->
                        <template x-if="taskModalOpen">
                            <!-- z-index bumped above the base .modal-overlay (100) so this can stack
                                 on top of the Upcoming modal (2026-07-28) -- same pattern the Restore
                                 view's hard-delete confirm already uses to stack on its own overlay. -->
                            <div class="modal-overlay" style="z-index: 150;" @click.self="closeTaskModal()">
                                <div class="modal task-edit-modal">
                                    <div class="task-edit-hero">
                                        <div class="task-edit-hero-left">
                                            <div class="task-edit-eyebrow" :class="{ reminder: taskForm.kind==='reminder' }">
                                                <span x-text="editingTaskId ? (taskForm.kind==='reminder' ? 'Edit reminder' : 'Edit task') : (taskForm.kind==='reminder' ? 'New reminder' : 'New task')"></span>
                                                <template x-if="editingTaskId && taskForm.projectId">
                                                    <span> · <span x-text="(projects.find(p => p.id === taskForm.projectId) || {}).name || ''"></span></span>
                                                </template>
                                            </div>
                                            <input class="task-edit-name-input" type="text" x-model="taskForm.name" placeholder="What do you need to do?" autofocus>
                                        </div>
                                        <template x-if="editingTaskId">
                                            <span class="task-edit-status" :class="{ 'in-progress': (tasks.find(t => t.id === editingTaskId) || {}).status === 'in_progress', 'done': (tasks.find(t => t.id === editingTaskId) || {}).status === 'done' }" x-text="((tasks.find(t => t.id === editingTaskId) || {}).status === 'in_progress' ? 'In progress' : ((tasks.find(t => t.id === editingTaskId) || {}).status === 'done' ? 'Done' : 'Not started'))"></span>
                                        </template>
                                    </div>

                                    <div class="modal-section-lbl">Schedule</div>
                                    <div class="field-row">
                                        <div class="field"><label>Date</label><input type="date" x-model="taskForm.date"></div>
                                        <div class="field"><label>Time</label>
                                            <div class="tp-numeric" x-data="timePicker12h" x-modelable="value" x-model="taskForm.time">
                                                <select :value="hh" @change="updateHH($event.target.value)" aria-label="Hour"><option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option><option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option></select><span class="colon">:</span><select :value="mm" @change="updateMM($event.target.value)" aria-label="Minute"><option value="00">00</option><option value="15">15</option><option value="30">30</option><option value="45">45</option></select><div class="tp-ampm" role="group" aria-label="AM or PM"><button type="button" @click.prevent="updateAMPM('AM')" :aria-pressed="ampm === 'AM'">AM</button><button type="button" @click.prevent="updateAMPM('PM')" :aria-pressed="ampm === 'PM'">PM</button></div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="field-checkbox"><label><input type="checkbox" x-model="taskForm.notify"> Notify me at this time</label></div>

                                    <div class="modal-section">
                                        <div class="modal-section-lbl">Assignment</div>
                                        <div class="field-row">
                                            <div class="field">
                                                <label>Type</label>
                                                <select :value="taskForm.kind" @change="taskForm.kind = $event.target.value">
                                                    <option value="task">Task</option>
                                                    <option value="reminder">Reminder</option>
                                                </select>
                                            </div>
                                            <div class="field">
                                                <label>Project</label>
                                                <select x-model="taskForm.projectId">
                                                    <option value="">Standalone</option>
                                                    <template x-for="p in projects" :key="p.id"><option :value="p.id" x-text="p.name"></option></template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="task-edit-actions">
                                        <template x-if="editingTaskId">
                                            <div style="display: flex; gap: 16px;">
                                                <button class="task-edit-delete" @click="deleteFromEditModal()" x-text="taskForm.kind==='reminder' ? 'Delete reminder' : 'Delete task'"></button>
                                                <button class="btn-text" style="color: var(--text-secondary);" x-show="taskForm.kind==='task' && (tasks.find(t => t.id === editingTaskId) || {}).status === 'in_progress'" @click="pauseTask()">Pause task</button>
                                            </div>
                                        </template>
                                        <template x-if="!editingTaskId"><span></span></template>
                                        <div class="task-edit-actions-right">
                                            <button class="btn-text" @click="closeTaskModal()">Cancel</button>
                                            <button class="btn btn-primary" @click="submitTask()" x-text="editingTaskId ? 'Save' : 'Add'"></button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- Upcoming modal (Phase 6) -- lists every future-dated task/
                             reminder (scheduled_date > today). Today's own list/filter
                             never widens to show these; this modal is the interim home
                             for them until a full History/Calendar page exists. Reuses
                             the exact same .trv2-row anatomy and edit flow as Today's
                             list -- no new row component. Stays open behind the task edit
                             modal when a row is clicked (2026-07-28) -- editing/rescheduling/
                             completing/deleting a task from here returns to this list, still
                             open, not back to the Today homepage. The edit modal's overlay
                             has a higher z-index (150) so it visually stacks on top. -->
                        <template x-if="upcomingModalOpen">
                            <div class="modal-overlay" @click.self="closeUpcomingModal()">
                                <div class="modal" style="max-width: 560px;">
                                    <div class="section-header" style="margin-top: 0;">
                                        <h2 style="margin: 0;">Upcoming</h2>
                                        <button class="btn-text" @click="closeUpcomingModal()">Close</button>
                                    </div>
                                    <p style="color: var(--text-muted); font-size: 12.5px; margin: 0 0 16px;">Future-dated tasks and reminders. Tap one to edit or reschedule it.</p>
                                    <div class="task-list" style="max-height: 60vh;">
                                        <template x-for="task in futureTasks" :key="task.id">
                                            <div class="trv2-row" @click="openTaskEditModal(task)" role="button" tabindex="0" @keydown.enter.prevent="openTaskEditModal(task)" @keydown.space.prevent="openTaskEditModal(task)" :aria-label="'Edit ' + (task.kind==='reminder' ? 'reminder' : 'task') + ': ' + task.name" style="grid-template-columns: auto minmax(0, 1fr) auto;">
                                                <button class="trv2-check" :class="{ 'is-pending': isPendingComplete(task) }" @click.stop="handleCompleteClick(task)" :aria-label="isPendingComplete(task) ? ('Confirm mark ' + task.name + ' done') : ('Mark ' + task.name + ' done')" :title="isPendingComplete(task) ? 'Tap again to confirm' : 'Mark done'">
                                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                                                </button>
                                                <div class="trv2-body" style="min-width: 0;">
                                                    <div class="trv2-name" x-text="task.name"></div>
                                                    <div class="trv2-meta" style="display: flex; align-items: center; flex-wrap: nowrap; overflow: hidden;">
                                                        <template x-if="task.kind==='reminder'">
                                                            <span class="trv2-kind reminder" style="flex-shrink: 0; margin-right: 6px;">
                                                                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                                                                Reminder
                                                            </span>
                                                        </template>
                                                        <template x-if="task.kind!=='reminder'">
                                                            <span class="trv2-kind task" x-text="projectFor(task) ? 'Task' : 'Task · Standalone'" style="flex-shrink: 0; margin-right: 6px;"></span>
                                                        </template>
                                                        <template x-if="projectFor(task)">
                                                            <span class="trv2-project" :class="'color-' + projectFor(task).color_key" style="flex-shrink: 0; margin-right: 6px;">
                                                                <span class="trv2-project-dot"></span>
                                                                <span x-text="projectFor(task).name"></span>
                                                            </span>
                                                        </template>
                                                        <template x-if="isPendingComplete(task)">
                                                            <span class="trv2-confirm-hint" style="flex-shrink: 0;">Tap ✓ again to confirm</span>
                                                        </template>
                                                    </div>
                                                </div>
                                                <div class="trv2-time-col">
                                                    <div class="trv2-time" x-text="window.formatTaskDateTime(task.scheduled_date, task.scheduled_time)"></div>
                                                </div>
                                            </div>
                                        </template>
                                        <template x-if="futureTasks.length === 0">
                                            <p style="color: var(--text-muted); font-style: italic; padding: var(--pad-md) 0;">Nothing upcoming.</p>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- Relapse modal -->
                        <template x-if="relapseTarget">
                            <div class="modal-overlay" @click.self="closeRelapseModal()">
                                <div class="modal">
                                    <h2 x-text="'Log ' + relapseTarget.name.toLowerCase() + ' relapse?'"></h2>
                                    <p class="system-text" x-text="`Your ${daysFor(relapseTarget)}-day streak will reset to 0 — unless you use a grace day.`"></p>
                                    <div class="field"><label>Reason (required)</label><input type="text" x-model="relapseForm.reason" placeholder="What happened?"></div>
                                    <div class="field-error" x-show="relapseError" x-text="relapseError"></div>
                                    <template x-if="!relapseTarget.grace_used">
                                        <div class="field-checkbox"><label><input type="checkbox" x-model="relapseForm.useGrace"> Use grace day — keep the streak alive</label></div>
                                    </template>
                                    <div class="modal-actions">
                                        <button class="btn-text" @click="closeRelapseModal()">Cancel</button>
                                        <button class="btn btn-primary" style="background: var(--accent-coral); border-color: var(--accent-coral);" @click="confirmRelapse()">Confirm</button>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- Sleep modal -->
                        <template x-if="sleepModalOpen">
                            <div class="modal-overlay" @click.self="closeSleepModal()">
                                <div class="modal">

                                    <!-- Step 1: Metrics -->
                                    <template x-if="sleepStep === 1">
                                        <div>
                                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                                                <h2 style="margin:0;">Log sleep · Metrics</h2>
                                                <span class="sleep-step-indicator">1 / 2</span>
                                            </div>
                                            <div class="field">
                                                <label>Duration</label>
                                                <div style="display:flex; gap: var(--pad-sm);">
                                                    <input type="number" x-model="sleepForm.hours" placeholder="Hours" min="0" max="24" style="flex:1;">
                                                    <input type="number" x-model="sleepForm.minutes" placeholder="Minutes" min="0" max="59" style="flex:1;">
                                                </div>
                                            </div>
                                            <div class="field-row">
                                                <div class="field"><label>Sleep score</label><input type="number" x-model="sleepForm.score" min="0" max="100"></div>
                                                <div class="field"><label>Resting HR</label><input type="number" x-model="sleepForm.restingHr" min="0"></div>
                                            </div>
                                            <div class="field-row">
                                                <div class="field"><label>Deep sleep (min)</label><input type="number" x-model="sleepForm.deep" min="0"></div>
                                                <div class="field"><label>REM sleep (min)</label><input type="number" x-model="sleepForm.rem" min="0"></div>
                                            </div>
                                            <div class="field"><label>HRV</label><input type="number" x-model="sleepForm.hrv" min="0" step="0.1"></div>
                                            <details class="sleep-context-details">
                                                <summary>Context note (optional)</summary>
                                                <div class="field" style="margin-top:8px;"><input type="text" x-model="sleepForm.note" placeholder="e.g. took melatonin"></div>
                                            </details>
                                            <div class="modal-actions">
                                                <button class="btn-text" @click="closeSleepModal()">Cancel</button>
                                                <div style="display:flex; gap:8px;">
                                                    <button class="btn btn-secondary" @click="saveSleepStep1()">Save</button>
                                                    <button class="btn btn-primary" @click="advanceSleepToStep2()">Next →</button>
                                                </div>
                                            </div>
                                        </div>
                                    </template>

                                    <!-- Step 2: Morning reflection -->
                                    <template x-if="sleepStep === 2">
                                        <div>
                                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                                                <h2 style="margin:0;">Log sleep · Reflection</h2>
                                                <span class="sleep-step-indicator">2 / 2</span>
                                            </div>
                                            <div class="field">
                                                <label>Morning reflection</label>
                                                <textarea x-model="sleepForm.morningNote" placeholder="How do you feel this morning?" rows="4" style="width:100%; resize:vertical;"></textarea>
                                            </div>
                                            <div class="modal-actions">
                                                <button class="btn-text" @click="sleepStep = 1">← Back</button>
                                                <button class="btn btn-primary" @click="saveSleep()">Save</button>
                                            </div>
                                        </div>
                                    </template>

                                </div>
                            </div>
                        </template>

                        <!-- Workout modal -->
                        <template x-if="workoutModalOpen">
                            <div class="modal-overlay" @click.self="closeWorkoutModal()">
                                <div class="modal">
                                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                                        <h2 style="margin: 0;">Workout Sessions</h2>
                                        <button class="btn btn-primary" x-show="!showSessionForm" @click="openWorkoutSessionForm()">+ Add</button>
                                    </div>
                                    
                                    <template x-if="!showSessionForm">
                                        <div class="stack">
                                            <template x-if="workoutSessions.length === 0">
                                                <div class="empty-state">No sessions logged yet.</div>
                                            </template>
                                            <template x-for="session in workoutSessions" :key="session.id">
                                                <div class="card panel" style="padding: 16px; margin-bottom: 12px;">
                                                    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                                        <div>
                                                            <div style="font-weight: 600; text-transform: capitalize;" x-text="session.activity_type.replace('_', ' ')"></div>
                                                            <div class="meta" style="color: var(--text-muted); font-size: 13px; margin-top: 4px;">
                                                                <span x-text="session.duration_minutes + ' min'"></span>
                                                                <template x-if="session.activity_type === 'strength' && session.intensity">
                                                                    <span x-text="' · ' + session.intensity"></span>
                                                                </template>
                                                                <template x-if="session.program_tag">
                                                                    <span x-text="' · ' + session.program_tag"></span>
                                                                </template>
                                                            </div>
                                                            <template x-if="session.note">
                                                                <div style="color: var(--text-secondary); font-size: 13px; margin-top: 8px; font-style: italic;" x-text="session.note"></div>
                                                            </template>
                                                        </div>
                                                        <div style="display: flex; gap: 8px;">
                                                            <button class="btn-text" @click.stop="openWorkoutSessionForm(session)">Edit</button>
                                                            <button class="btn-text" @click.stop="deleteWorkoutSession(session.id)" style="color: var(--accent-coral);">Delete</button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </template>
                                            <div class="modal-actions" style="margin-top: 16px;">
                                                <button class="btn-text" @click="closeWorkoutModal()">Close</button>
                                            </div>
                                        </div>
                                    </template>

                                    <template x-if="showSessionForm">
                                        <div>
                                            <div class="field">
                                                <label>Activity Type</label>
                                                <select x-model="workoutSessionForm.type">
                                                    <option value="strength">Strength</option>
                                                    <option value="cardio_walk">Cardio / Walk</option>
                                                    <option value="yoga_stretch">Yoga / Stretch</option>
                                                    <option value="active_play">Active Play</option>
                                                    <option value="cleaning">Cleaning</option>
                                                </select>
                                            </div>
                                            <div class="field-row">
                                                <div class="field"><label>Duration (minutes)</label><input type="number" x-model="workoutSessionForm.duration" min="1"></div>
                                                <template x-if="workoutSessionForm.type === 'strength'">
                                                    <div class="field">
                                                        <label>Intensity</label>
                                                        <select x-model="workoutSessionForm.intensity">
                                                            <option value="">(None)</option>
                                                            <option value="light">Light</option>
                                                            <option value="moderate">Moderate</option>
                                                            <option value="hard">Hard</option>
                                                        </select>
                                                    </div>
                                                </template>
                                            </div>
                                            <template x-if="workoutSessionForm.type === 'strength'">
                                                <div class="field">
                                                    <label>Program Tag</label>
                                                    <select x-model="workoutSessionForm.programTag">
                                                        <option value="">(None)</option>
                                                        <option value="upper">Upper</option>
                                                        <option value="lower">Lower</option>
                                                        <option value="push">Push</option>
                                                        <option value="pull">Pull</option>
                                                        <option value="legs">Legs</option>
