<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atlas</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#131316">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/icon-192.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Styles -->
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">

    <!-- Pre-load theme before Alpine -->
    <script type="module">
        import { initTheme } from './js/theme.js';
        initTheme();
    </script>

    <!-- App Entry (loads and starts Alpine itself, after components are registered) -->
    <script type="module" src="js/main.js"></script>
</head>
<body x-data="app()" x-init="init()">

    <!-- Loading placeholder while the session check runs -->
    <template x-if="!authReady">
        <div class="empty-state"><p>Loading Atlas…</p></div>
    </template>

    <!-- Sign-in screen -->
    <template x-if="authReady && !session">
        <div class="login-screen">
            <div class="card login-card" x-data="loginForm()">
                <span class="wordmark">Atlas</span>
                <form @submit.prevent="submit()">
                    <div class="field">
                        <label for="login-email">Email</label>
                        <input id="login-email" type="email" x-model="email" required autocomplete="username">
                    </div>
                    <div class="field">
                        <label for="login-password">Password</label>
                        <input id="login-password" type="password" x-model="password" required autocomplete="current-password">
                    </div>
                    <div class="field-error" x-show="error" x-text="error"></div>
                    <button type="submit" class="btn btn-primary" style="width:100%" :disabled="loading">
                        <span x-text="loading ? 'Signing in…' : 'Sign in'"></span>
                    </button>
                </form>
            </div>
        </div>
    </template>

    <!-- Main app shell -->
    <template x-if="authReady && session">
        <div>
            <header class="top-header">
                <div class="logo">
                    <!-- Compass polygon filled (2026-07-26 polish) so the mark has
                         real presence at 24px, not a wire silhouette next to the
                         weightier wordmark. Circle stays a stroke -- filling both
                         would over-boldify the icon. -->
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" fill="currentColor" stroke="none"></polygon>
                    </svg>
                    <span class="wordmark">Atlas</span>
                </div>

                <div class="header-actions">
                    <button class="icon-button icon-button-accent" :class="{active: overlay==='notebook'}" @click="toggleOverlay('notebook')" title="Notebook">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                        </svg>
                    </button>
                    <button class="icon-button icon-button-accent" :class="{active: overlay==='restore'}" @click="toggleOverlay('restore')" title="Restore">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 12a9 9 0 1 0 3-6.7"></path>
                            <polyline points="3 4 3 9 8 9"></polyline>
                        </svg>
                    </button>
                    <span class="user-name">Abhishek</span>
                    <button class="theme-switcher-btn"
                            x-data="themeSwitcher"
                            @click="cycle()"
                            x-html="icon"
                            :title="`Current theme: ${current}`">
                    </button>
                    <button class="icon-button" @click="doSignOut()" title="Sign out">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                    </button>
                </div>
            </header>

            <nav class="top-tabs">
                <button class="tab" :class="{active: tab==='today'}" @click="setTab('today')">Today</button>
                <button class="tab" :class="{active: tab==='projects'}" @click="setTab('projects')">Projects</button>
            </nav>

            <main class="content-area">

                <!-- Notebook overlay -->
                <template x-if="overlay==='notebook'">
                    <div class="modal-overlay" @click.self="overlay=null">
                        <div class="modal" x-data="notebookPage({ onClose: () => overlay=null })" style="max-width: 680px; width: 95%; max-height: 90vh; overflow-y: auto;">
                            <div class="section-header" style="margin-top: 0;">
                                <h1 style="font-size: 24px; margin: 0;">Notebook</h1>
                                <button class="btn-text" @click="close()">Close</button>
                            </div>
                            <div class="field-error" x-show="errorMsg" x-text="errorMsg"></div>
                            <template x-if="loading"><p>Loading…</p></template>
                            <template x-if="!loading">
                                <div class="stack">
                                    <div class="card workspace-section">
                                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--pad-sm);">
                                            <h2 x-text="todayDate" style="margin: 0;"></h2>
                                            <span class="system-text" x-show="savedState === 'saved'" style="color: var(--accent-sage);">✓ Saved</span>
                                        </div>
                                        <div class="field">
                                            <textarea x-model="draft" rows="12" placeholder="What happened today?" @input="savedState = 'draft'"></textarea>
                                        </div>
                                        <button class="btn btn-primary" @click="save()" :disabled="savedState === 'saving'">
                                            <span x-text="savedState === 'saving' ? 'Saving...' : 'Save'"></span>
                                        </button>
                                    </div>
                                    <template x-if="pastEntries.length > 0">
                                        <div style="margin-top: var(--pad-lg);">
                                            <h3 class="system-text" style="margin-bottom: var(--pad-sm);">Previous entries</h3>
                                            <div class="stack">
                                                <template x-for="entry in pastEntries" :key="entry.id">
                                                    <div class="card note-entry">
                                                        <div class="note-date" x-text="entry.entry_date"></div>
                                                        <p x-text="entry.body" style="white-space: pre-wrap;"></p>
                                                        <button class="btn-text" @click="deleteEntry(entry)">Delete</button>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- Restore overlay -->
                <template x-if="overlay==='restore'">
                    <div class="modal-overlay" @click.self="overlay=null">
                        <div class="modal" x-data="restorePage({ onClose: () => overlay=null })" style="max-width: 680px; width: 95%; max-height: 90vh; overflow-y: auto;">
                            <div class="section-header" style="margin-top: 0;">
                                <h1 style="font-size: 24px; margin: 0;">Restore</h1>
                                <button class="btn-text" @click="close()">Close</button>
                            </div>
                        <p class="project-focus">Anything you deleted lives here. Restore brings it back; Delete forever cannot be undone.</p>
                        <div class="field-error" x-show="errorMsg" x-text="errorMsg"></div>
                        <template x-if="loading"><p>Loading…</p></template>
                        <template x-if="!loading">
                            <div class="stack">
                                <template x-for="section in sections" :key="section.key">
                                    <div class="card workspace-section">
                                        <button class="log-date-header" @click="toggleSection(section)" style="width:100%;">
                                            <span x-text="`${section.label}: ${section.items.length}`"></span>
                                            <span x-text="section.expanded ? '−' : '+'"></span>
                                        </button>
                                        <template x-if="section.expanded && section.items.length === 0">
                                            <p class="project-focus" style="margin-top: var(--pad-sm);">Nothing here.</p>
                                        </template>
                                        <template x-if="section.expanded && section.items.length > 0">
                                            <div style="margin-top: var(--pad-sm);">
                                                <template x-for="row in section.items" :key="row.id">
                                                    <div class="restore-row card-nested">
                                                        <span x-text="labelOf(section, row)"></span>
                                                        <div class="restore-row-actions">
                                                            <button class="btn-text" @click="restoreRow(section, row)">Restore</button>
                                                            <button class="btn-text" style="color: var(--accent-coral)" @click="askHardDeleteRow(section, row)">Delete forever</button>
                                                        </div>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>
                        <!-- Delete Confirmation Modal handled inside Restore Overlay is already fine, wait, modal in modal might conflict if nested modal-overlay is used, but z-index handles it -->
                        <template x-if="confirmingHardDelete">
                            <div class="modal-overlay" style="z-index: 200;" @click.self="cancelHardDelete()">
                                <div class="modal">
                                    <h2>Delete forever?</h2>
                                    <p class="project-focus">This permanently removes "<span x-text="confirmingHardDelete.label"></span>" — it cannot be undone.</p>
                                    <div class="modal-actions">
                                        <button class="btn-text" @click="cancelHardDelete()">Cancel</button>
                                        <button class="btn btn-danger" @click="confirmHardDelete()">Delete forever</button>
                                    </div>
                                </div>
                            </div>
                        </template>
                        </div>
                    </div>
                </template>

                <!-- Today tab -->
                <template x-if="tab==='today'">
                    <div x-data="todayPage()">
                        <div class="section-header">
                            <!-- Today title block: H1 above its own date, so the page title
                                 clearly outranks the top-nav tabs (Today / Projects). Replaces
                                 the old H1 + separate <p class="sub"> below. -->
                            <div class="today-block">
                                <h1>Today</h1>
                                <div class="today-date" x-text="todayLabel"></div>
                            </div>
                            <button class="icon-button journal-btn" :class="{active: journalOpen}" @click="journalOpen = !journalOpen" aria-label="Log an emotion or thought about today">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                                <span class="tooltip">Log an emotion or thought about today</span>
                            </button>
                        </div>
                        <template x-if="journalOpen">
                            <div class="card panel" style="margin-bottom: var(--pad-md);">
                                <div class="field"><textarea x-model="noteDraft" rows="3" placeholder="Log an emotion, a thought, anything…" autofocus></textarea></div>
                                <button class="btn btn-primary" @click="saveNote()" :disabled="noteSaving">Save</button>
                            </div>
                        </template>
                        <div class="field-error" x-show="errorMsg" x-text="errorMsg"></div>
                        <template x-if="loading"><p>Loading…</p></template>
                        <template x-if="!loading">
                            <div class="stack">

                                <!-- Hero band: streaks flank the KPI strip -->
                                <div class="hero-band">
                                    <template x-if="streaks[0]">
                                        <div class="card streak-card" :class="'color-' + streaks[0].color_key">
                                            <div class="streak-num" x-text="daysFor(streaks[0])"></div>
                                            <div class="streak-unit">days</div>
                                            <div class="streak-label" x-text="streaks[0].name"></div>
                                            <template x-if="streakMeta(streaks[0])">
                                                <div class="streak-meta" :class="{grace: streakMeta(streaks[0]).grace}" x-text="streakMeta(streaks[0]).text"></div>
                                            </template>
                                            <button class="streak-action relapse" @click="openRelapseModal(streaks[0])">relapse</button>
                                        </div>
                                    </template>

                                    <div class="kpi-strip">
                                        <div class="card kpi-card">
                                            <div class="kpi-top">
                                                <div class="kpi-icon blue"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div>
                                                <div style="text-align:right;"><div class="kpi-num-lg"><span x-text="recentlyCompleted.length"></span><span class="denom" x-text="'/' + tasksTodayTotal"></span></div><div class="kpi-label">Tasks today</div></div>
                                            </div>
                                            <div class="kpi-dot-row">
                                                <template x-for="(t, i) in upcomingTasks.slice(0,5)" :key="t.id"><span class="kpi-dot on"></span></template>
                                                <template x-for="i in Math.max(0, 5 - upcomingTasks.length)" :key="'e'+i"><span class="kpi-dot"></span></template>
                                            </div>
                                            <template x-if="upcomingTasks[0]">
                                                <div class="kpi-next"><span><span class="lbl">Next up</span><span x-text="upcomingTasks[0].name"></span></span><span style="color:var(--text-muted);" x-text="upcomingTasks[0].scheduled_time ? window.formatTime12h(upcomingTasks[0].scheduled_time) : ''"></span></div>
                                            </template>
                                        </div>

                                        <div class="card kpi-card">
                                            <div class="kpi-top">
                                                <div class="kpi-icon lilac"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg></div>
                                                <div style="text-align:right;"><div class="kpi-num-lg" x-text="activeProjectCount"></div><div class="kpi-label">Active projects</div></div>
                                            </div>
                                            <div class="kpi-proj-list">
                                                <template x-for="p in projects.slice(0,3)" :key="p.id">
                                                    <div class="kpi-proj-row"><span class="kpi-proj-chip" :class="'color-' + p.color_key" x-text="projectInitial(p)"></span><span x-text="p.name"></span></div>
                                                </template>
                                                <template x-if="projects.length === 0"><p class="project-focus" style="margin:0;">No active projects.</p></template>
                                            </div>
                                        </div>

                                        <div class="card kpi-card hero">
                                            <div class="kpi-label" style="align-self:flex-start;">Checklist today</div>
                                            <!-- Ring auto-scales to its .kpi-ring-wrap size (128px) via
                                                 the SVG width:100%/height:100% rule in components.css; the
                                                 viewBox stays 100x100 so the stroke-dasharray maths still
                                                 works. Don't hardcode width/height here. -->
                                            <div class="kpi-ring-wrap">
                                                <svg viewBox="0 0 100 100">
                                                    <circle cx="50" cy="50" r="42" fill="none" stroke="var(--surface-2)" stroke-width="10"/>
                                                    <!-- Layer 2 = done+skipped combined arc. Amber is Atlas's
                                                         skipped color across the whole app (trend chart legend +
                                                         checklist mini-dots), so the visible "skipped" segment in
                                                         the ring now matches those. Was --border-hover, which was
                                                         essentially invisible against --surface-2 (Abhishek's
                                                         direct feedback, 2026-07-26). -->
                                                    <circle cx="50" cy="50" r="42" fill="none" stroke="var(--accent-amber)" stroke-width="10" stroke-linecap="round" stroke-dasharray="264" :stroke-dashoffset="checklistTotalToday ? (264 - (264 * (checklistDoneToday + checklistSkippedToday) / checklistTotalToday)) : 264"/>
                                                    <circle cx="50" cy="50" r="42" fill="none" stroke="var(--accent-sage)" stroke-width="10" stroke-linecap="round" stroke-dasharray="264" :stroke-dashoffset="checklistTotalToday ? (264 - (264 * checklistDoneToday / checklistTotalToday)) : 264"/>
                                                </svg>
                                                <div class="kpi-ring-num"><span class="n" x-text="`${checklistDoneToday}/${checklistTotalToday}`"></span><span class="d" x-text="checklistPct + '%'"></span></div>
                                            </div>
                                            <div class="kpi-label">
                                                <span x-text="checklistRemaining + (checklistRemaining === 1 ? ' item left today' : ' items left today')"></span>
                                                <template x-if="checklistSkippedToday > 0">
                                                    <span style="margin-left: 6px;">
                                                        <span class="trend-dot trend-skipped" style="width:8px;height:8px;margin-right:4px;"></span>
                                                        <span x-text="checklistSkippedToday + (checklistSkippedToday === 1 ? ' skipped' : ' skipped')"></span>
                                                    </span>
                                                </template>
                                            </div>
                                        </div>
                                    </div>

                                    <template x-if="streaks[1]">
                                        <div class="card streak-card" :class="'color-' + streaks[1].color_key">
                                            <div class="streak-num" x-text="daysFor(streaks[1])"></div>
                                            <div class="streak-unit">days</div>
                                            <div class="streak-label" x-text="streaks[1].name"></div>
                                            <template x-if="streakMeta(streaks[1])">
                                                <div class="streak-meta" :class="{grace: streakMeta(streaks[1]).grace}" x-text="streakMeta(streaks[1]).text"></div>
                                            </template>
                                            <button class="streak-action relapse" @click="openRelapseModal(streaks[1])">relapse</button>
                                        </div>
                                    </template>
                                </div>

                                <!-- Tasks & Reminders (60%) | Sleep + Workout (40%) -->
                                <div class="split-60-40">
                                    <div class="card panel col-height">
                                        <div class="panel-head">
                                            <h2 style="margin:0;">Tasks &amp; Reminders</h2>
                                            <button class="add-btn" @click="openTaskModal()">+ Add task</button>
                                        </div>
                                        <div class="task-list">
                                            <!-- Empty state: three pulsing dots + one headline + one line of
                                                 helper copy. Mature, no cartoon. Animation collapses under
                                                 prefers-reduced-motion via tokens.css's global override. Only
                                                 shows when both upcoming and recently-completed are empty -- a
                                                 few completed items today still says "you were busy". -->
                                            <template x-if="upcomingTasks.length === 0 && recentlyCompleted.length === 0">
                                                <div class="empty-tasks">
                                                    <div class="empty-cue-tasks">
                                                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                            <path d="M20 6L9 17l-5-5"/>
                                                        </svg>
                                                    </div>
                                                    <div class="headline">Nothing scheduled today</div>
                                                    <div class="help">Add a task above, or check the Routine section below for what's next.</div>
                                                </div>
                                            </template>
                                            <template x-for="task in upcomingTasks" :key="task.id">
                                                <div class="trv2-row" :class="{ 'is-overdue': isOverdue(task), 'is-done': task.status==='done' }" @click="openTaskEditModal(task)" role="button" tabindex="0" @keydown.enter.prevent="openTaskEditModal(task)" @keydown.space.prevent="openTaskEditModal(task)" :aria-label="'Edit ' + (task.kind==='reminder' ? 'reminder' : 'task') + ': ' + task.name" style="grid-template-columns: auto minmax(0, 1fr) auto;">
                                                    <button class="trv2-check" :class="{ 'is-pending': isPendingComplete(task) }" @click.stop="handleCompleteClick(task)" :aria-label="isPendingComplete(task) ? ('Confirm mark ' + task.name + ' done') : ('Mark ' + task.name + ' done')" :title="isPendingComplete(task) ? 'Tap again to confirm' : 'Mark done'">
                                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                                                    </button>
                                                    <div class="trv2-body">
                                                        <div class="trv2-name" x-text="task.name"></div>
                                                        <div class="trv2-meta">
                                                            <template x-if="task.kind==='reminder'">
                                                                <span class="trv2-kind reminder">
                                                                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                                                                    Reminder
                                                                </span>
                                                            </template>
                                                            <template x-if="task.kind!=='reminder'">
                                                                <span class="trv2-kind task" x-text="projectFor(task) ? 'Task' : 'Task · Standalone'"></span>
                                                            </template>
                                                            <template x-if="projectFor(task)">
                                                                <span class="trv2-project" :class="'color-' + projectFor(task).color_key">
                                                                    <span class="trv2-project-dot"></span>
                                                                    <span x-text="projectFor(task).name"></span>
                                                                </span>
                                                            </template>
                                                            <template x-if="isPendingComplete(task)">
                                                                <span class="trv2-confirm-hint">Tap ✓ again to confirm</span>
                                                            </template>
                                                        </div>
                                                        <template x-if="task.status === 'paused' && task.running_note">
                                                            <div class="trv2-pause-reason" x-text="task.running_note"></div>
                                                        </template>
                                                    </div>
                                                    <div class="trv2-time-col">
                                                        <div class="trv2-time" :class="{ overdue: isOverdue(task) }" x-text="task.scheduled_time ? window.formatTime12h(task.scheduled_time) : (task.scheduled_date || '')"></div>
                                                        <template x-if="isOverdue(task)">
                                                            <div class="trv2-time-tag">Overdue</div>
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>

                                            <template x-if="recentlyCompleted.length > 0">
                                                <div>
                                                    <div class="task-list-divider">Recently completed</div>
                                                    <template x-for="task in recentlyCompleted" :key="task.id">
                                                        <div class="trv2-row is-done is-inert" style="grid-template-columns: auto minmax(0, 1fr) auto;">
                                                            <button class="trv2-check is-done" tabindex="-1" aria-hidden="true">
                                                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                                                            </button>
                                                            <div class="trv2-body">
                                                                <div class="trv2-name" x-text="task.name"></div>
                                                                <div class="trv2-meta">
                                                                    <template x-if="task.kind!=='reminder'">
                                                                        <span class="trv2-kind task" x-text="projectFor(task) ? 'Task' : 'Task · Standalone'"></span>
                                                                    </template>
                                                                    <template x-if="task.kind==='reminder'">
                                                                        <span class="trv2-kind reminder">Reminder</span>
                                                                    </template>
                                                                    <template x-if="projectFor(task)">
                                                                        <span class="trv2-project" :class="'color-' + projectFor(task).color_key">
                                                                            <span class="trv2-project-dot"></span>
                                                                            <span x-text="projectFor(task).name"></span>
                                                                        </span>
                                                                    </template>
                                                                </div>
                                                            </div>
                                                            <div class="trv2-time-col">
                                                                <div class="trv2-time" x-text="task.completed_at ? ('Done · ' + window.formatTime12h(task.completed_at.slice(11,16))) : 'Done'"></div>
                                                            </div>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </div>

                                    <div class="vitals-stack col-height">
                                        <div class="card vital-card">
                                            <div class="panel-head" style="margin-bottom: 8px;">
                                                <h2 style="margin:0; font-size: 13px;">Sleep</h2>
                                                <button class="btn-text" @click="openSleepModal()" x-text="sleepEntry ? 'Edit' : 'Log sleep'"></button>
                                            </div>
                                            <template x-if="!hasSleepData">
                                                <div class="nodata">
                                                    <div class="empty-cue-sleep">
                                                        <span class="z1">z</span><span class="z2">z</span><span class="z3">z</span>
                                                    </div>
                                                    <span class="h">No sleep logged today</span>
                                                    <span class="p">Log manually below, or wait for the auto-parse from your ring screenshot (planned).</span>
                                                </div>
                                            </template>
                                            <template x-if="hasSleepData">
                                                <div class="metric-grid">
                                                    <div class="metric"><span class="v" x-text="sleepEntry.sleep_score ?? '—'"></span><span class="l">Score</span></div>
                                                    <div class="metric"><span class="v" x-text="sleepEntry.duration_minutes != null ? Math.floor(sleepEntry.duration_minutes/60)+'h '+(sleepEntry.duration_minutes%60)+'m' : '—'"></span><span class="l">Duration</span></div>
                                                    <div class="metric"><span class="v" x-text="sleepEntry.deep_minutes != null ? sleepEntry.deep_minutes+'m' : '—'"></span><span class="l">Deep</span></div>
                                                    <div class="metric"><span class="v" x-text="sleepEntry.rem_minutes != null ? sleepEntry.rem_minutes+'m' : '—'"></span><span class="l">REM</span></div>
                                                    <div class="metric"><span class="v" x-text="sleepEntry.resting_hr ?? '—'"></span><span class="l">Resting HR</span></div>
                                                    <div class="metric"><span class="v" x-text="sleepEntry.hrv ?? '—'"></span><span class="l">HRV</span></div>
                                                </div>
                                            </template>
                                        </div>
                                        <div class="card vital-card">
                                            <div class="panel-head" style="margin-bottom: 8px;">
                                                <h2 style="margin:0; font-size: 13px;">Workout</h2>
                                                <button class="btn-text" x-show="workoutDayType === 'workout'" @click="openWorkoutModal()" x-text="hasWorkoutData ? 'Edit' : 'Log details'"></button>
                                            </div>
                                            <!-- Day-type toggle (Round 2 build, item 5). Three chips:
                                                 Workout / Active recovery / Full rest. Only the Workout
                                                 chip surfaces the metric form; the other two are
                                                 one-tap-and-done with their own calm treatment. -->
                                            <div class="wo-daytype-group" role="tablist">
                                                <button class="wo-daytype-chip" data-type="workout" :aria-pressed="workoutDayType === 'workout'" @click="setWorkoutDayType('workout')">
                                                    <span class="wo-daytype-icon">
                                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v16M18 4v16M4 8h4M4 16h4M16 8h4M16 16h4"/></svg>
                                                    </span>
                                                    Workout
                                                </button>
                                                <button class="wo-daytype-chip" data-type="recovery" :aria-pressed="workoutDayType === 'active_recovery'" @click="setWorkoutDayType('active_recovery')">
                                                    <span class="wo-daytype-icon">
                                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
                                                    </span>
                                                    Recovery
                                                </button>
                                                <button class="wo-daytype-chip" data-type="rest" :aria-pressed="workoutDayType === 'full_rest'" @click="setWorkoutDayType('full_rest')">
                                                    <span class="wo-daytype-icon">
                                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                                                    </span>
                                                    Full rest
                                                </button>
                                            </div>

                                            <!-- Unset (no day-type picked yet): keep the existing empty
                                                 helper text so the card doesn't look broken. -->
                                            <template x-if="!workoutDayType">
                                                <div class="nodata">
                                                    <span class="h">No workout day-type picked</span>
                                                    <span class="p">Tap one of the three chips above to mark today.</span>
                                                </div>
                                            </template>

                                            <!-- Workout day: keep existing metric grid + no-data helper -->
                                            <template x-if="workoutDayType === 'workout' && !hasWorkoutData">
                                                <div class="nodata">
                                                    <div class="empty-cue-workout">
                                                        <svg width="24" height="8" viewBox="0 0 24 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                                                            <path d="M2 4h20" class="track-line" />
                                                            <circle cx="12" cy="4" r="3" class="track-dot" fill="currentColor" stroke="none" />
                                                        </svg>
                                                    </div>
                                                    <span class="h">Workout day · no details yet</span>
                                                    <span class="p">Tap <strong>Log details</strong> above, or wait for the auto-parse from your workout-app screenshot (planned).</span>
                                                </div>
                                            </template>
                                            <template x-if="workoutDayType === 'workout' && hasWorkoutData">
                                                <div class="metric-grid">
                                                    <div class="metric"><span class="v" x-text="workoutEntry.workout_score ?? '—'"></span><span class="l">Score</span></div>
                                                    <div class="metric"><span class="v" x-text="workoutEntry.workout_type || '—'"></span><span class="l">Type</span></div>
                                                    <div class="metric"><span class="v" x-text="workoutEntry.duration_minutes != null ? workoutEntry.duration_minutes+'m' : '—'"></span><span class="l">Minutes</span></div>
                                                    <div class="metric"><span class="v" x-text="workoutEntry.calories ?? '—'"></span><span class="l">Calories</span></div>
                                                    <div class="metric"><span class="v" x-text="workoutEntry.vo2_max ?? '—'"></span><span class="l">VO2 max</span></div>
                                                </div>
                                            </template>

                                            <!-- Active recovery: calm lilac pulse -->
                                            <template x-if="workoutDayType === 'active_recovery'">
                                                <div class="wo-state">
                                                    <div class="wo-recovery-animation" aria-hidden="true">
                                                        <span class="wo-recovery-dot"></span>
                                                        <span class="wo-recovery-dot"></span>
                                                        <span class="wo-recovery-dot"></span>
                                                    </div>
                                                    <div class="wo-state-label">Active recovery day</div>
                                                    <div class="wo-state-sub">Logged — no details to enter.</div>
                                                </div>
                                            </template>

                                            <!-- Full rest: pulsing moon -->
                                            <template x-if="workoutDayType === 'full_rest'">
                                                <div class="wo-state">
                                                    <div class="wo-rest-icon" aria-hidden="true">
                                                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                                                    </div>
                                                    <div class="wo-state-label">Full rest day</div>
                                                    <div class="wo-state-sub">Nothing to log. Sleep well tonight.</div>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </div>

                                <!-- Routine: checklist only -->
                                <div x-data="checklistPage()">
                                    <div class="card panel">
                                        <div class="panel-head">
                                            <h2 style="margin:0;">Routine</h2>
                                            <button class="btn-text" @click="toggleManaging()" x-text="managing ? 'Done managing' : 'Manage items'"></button>
                                        </div>
                                        <div class="field-error" x-show="errorMsg" x-text="errorMsg"></div>
                                        <template x-if="loading"><p>Loading…</p></template>
                                        <template x-if="!loading">
                                            <div class="stack">
                                                <template x-for="block in blocks" :key="block.key">
                                                    <div class="cl-block" :class="'color-' + block.colorKey + (collapsedBlocks[block.key] ? ' collapsed' : '')" x-show="itemsForBlock(block.key).length > 0 || managing">
                                                        <div class="cl-block-header" @click="toggleBlock(block.key)">
                                                            <span class="cl-block-icon" x-text="block.icon"></span>
                                                            <span class="cl-block-title" x-text="block.label"></span>
                                                            <div class="cl-block-stats">
                                                                <span class="cl-block-count" x-text="`${doneCountForBlock(block.key)}/${itemsForBlock(block.key).length}`"></span>
                                                                <div class="cl-mini-dots">
                                                                    <template x-for="item in itemsForBlock(block.key)" :key="item.id">
                                                                        <span class="cl-mini-dot" :class="statusFor(item)==='done' ? 'done' : (statusFor(item) ? 'skip' : 'pending')" :title="item.name"></span>
                                                                    </template>
                                                                </div>
                                                                <div class="cl-mini-bar"><div class="cl-mini-fill" :class="'color-' + block.colorKey" :style="`width:${blockProgress(block.key)}%`"></div></div>
                                                                <span class="cl-chevron">▼</span>
                                                            </div>
                                                        </div>

                                                        <div class="cl-block-body">
                                                            <template x-for="item in itemsForBlock(block.key)" :key="item.id">
                                                                <div class="ck-row" :class="statusFor(item)==='done' ? 'is-done' : (statusFor(item)==='skipped' ? 'is-skipped' : '')">
                                                                    <template x-if="editingItemId !== item.id">
                                                                        <div class="ck-row-main">
                                                                            <div class="ck-icon" x-text="item.icon || '📋'"></div>
                                                                            <div class="ck-info"><div class="ck-title" x-text="item.name"></div></div>
                                                                            <template x-if="!managing">
                                                                                <div class="ck-row-actions">
                                                                                    <span class="ck-status" :class="'ck-status-' + (statusFor(item) || 'pending')" x-text="statusLabel(item)"></span>
                                                                                    <button class="ck-log-btn" @click="openLog(item)">Log</button>
                                                                                </div>
                                                                            </template>
                                                                            <template x-if="managing">
                                                                                <div class="ck-row-actions">
                                                                                    <button class="icon-button" @click="moveItem(item,'up')" title="Move up">↑</button>
                                                                                    <button class="icon-button" @click="moveItem(item,'down')" title="Move down">↓</button>
                                                                                    <button class="btn-text" @click="startEditItem(item)">Edit</button>
                                                                                    <button class="btn-text" style="color: var(--accent-coral)" @click="archiveItem(item)">Archive</button>
                                                                                </div>
                                                                            </template>
                                                                        </div>
                                                                    </template>
                                                                    <template x-if="editingItemId === item.id">
                                                                        <div class="ck-edit-form">
                                                                            <div class="field"><label>Name</label><input type="text" x-model="editForm.name"></div>
                                                                            <div class="field">
                                                                                <label>Block</label>
                                                                                <select x-model="editForm.block">
                                                                                    <template x-for="b in blocks" :key="b.key"><option :value="b.key" x-text="b.label"></option></template>
                                                                                </select>
                                                                            </div>
                                                                            <div class="field"><label>Icon (optional)</label><input type="text" x-model="editForm.icon" maxlength="4"></div>
                                                                            <div class="field">
                                                                                <label>Days (leave all off for every day)</label>
                                                                                <div class="day-picker">
                                                                                    <template x-for="(d, idx) in dayNames" :key="idx">
                                                                                        <button type="button" class="day-chip" :class="{active: editForm.days.includes(idx)}" @click="toggleEditDay(idx)" x-text="d"></button>
                                                                                    </template>
                                                                                </div>
                                                                            </div>
                                                                            <div class="modal-actions">
                                                                                <button class="btn-text" @click="cancelEditItem()">Cancel</button>
                                                                                <button class="btn btn-primary" @click="saveEditItem(item)">Save</button>
                                                                            </div>
                                                                        </div>
                                                                    </template>
                                                                </div>
                                                            </template>

                                                            <template x-if="managing && addingToBlock !== block.key">
                                                                <button class="btn-text" @click="openAdd(block.key)">+ Add item</button>
                                                            </template>
                                                            <template x-if="managing && addingToBlock === block.key">
                                                                <div class="card-nested" style="padding: var(--pad-sm) var(--pad-md);">
                                                                    <div class="field"><input type="text" x-model="addForm.name" placeholder="Item name" @keydown.enter="submitAdd()"></div>
                                                                    <div class="field"><input type="text" x-model="addForm.icon" placeholder="Icon (optional)" maxlength="4"></div>
                                                                    <div class="field">
                                                                        <label>Days (leave all off for every day)</label>
                                                                        <div class="day-picker">
                                                                            <template x-for="(d, idx) in dayNames" :key="idx">
                                                                                <button type="button" class="day-chip" :class="{active: addForm.days.includes(idx)}" @click="toggleAddDay(idx)" x-text="d"></button>
                                                                            </template>
                                                                        </div>
                                                                    </div>
                                                                    <div class="modal-actions">
                                                                        <button class="btn-text" @click="cancelAdd()">Cancel</button>
                                                                        <button class="btn btn-primary" @click="submitAdd()">Add</button>
                                                                    </div>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                    </div>

                                    <!-- Log popup: time + optional note, then Done / Skip / Holiday / Undo -->
                                    <template x-if="logItem">
                                        <div class="modal-overlay" @click.self="closeLog()">
                                            <div class="modal">
                                                <h2 x-text="logItem.name"></h2>
                                                <p class="system-text" x-text="'Currently: ' + statusLabel(logItem)"></p>
                                                <div class="field">
                                                    <label>Time</label>
                                                    <div class="tp-numeric" x-data="timePicker12h" x-modelable="value" x-model="logForm.time">
                                                        <input type="tel" :value="hh" @input="updateHH($event.target.value)" maxlength="2" placeholder="12" inputmode="numeric" aria-label="Hour"><span class="colon">:</span><input type="tel" :value="mm" @input="updateMM($event.target.value)" maxlength="2" placeholder="00" inputmode="numeric" aria-label="Minute"><div class="tp-ampm" role="group" aria-label="AM or PM"><button type="button" @click.prevent="updateAMPM('AM')" :aria-pressed="ampm === 'AM'">AM</button><button type="button" @click.prevent="updateAMPM('PM')" :aria-pressed="ampm === 'PM'">PM</button></div>
                                                    </div>
                                                </div>
                                                <div class="field">
                                                    <label>Note (optional)</label>
                                                    <input type="text" x-model="logForm.note" placeholder="Optional note...">
                                                </div>
                                                <div class="modal-actions" style="flex-wrap: wrap;">
                                                    <button class="btn btn-primary" style="flex:1;" @click="confirmLog('done')">✓ Done</button>
                                                    <button class="btn" style="flex:1;" @click="confirmLog('skipped')">Skip</button>
                                                    <button class="btn" style="flex:1;" @click="confirmLog('holiday')">🏖️ Holiday</button>
                                                </div>
                                                <div class="modal-actions">
                                                    <button class="btn-text" @click="closeLog()">Cancel</button>
                                                    <button class="btn btn-danger" @click="clearLog()">Undo / Clear</button>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </div>

                                <!-- Checklist Completion trend -->
                                <div class="card workspace-section">
                                    <h2>Checklist Completion</h2>
                                    <div class="trend-legend">
                                        <span><span class="trend-dot trend-done"></span>Done</span>
                                        <span><span class="trend-dot trend-skipped"></span>Skipped</span>
                                        <span><span class="trend-dot trend-missed"></span>Missed</span>
                                    </div>
                                    <div class="trend-chart">
                                        <template x-for="d in trendDays" :key="d.date">
                                            <div class="trend-col" :title="`${d.date} — ${d.done} done, ${d.skipped} skipped, ${d.missed} missed`">
                                                <div class="trend-bar">
                                                    <div class="trend-seg trend-missed" :style="`height:${d.missed/d.total*100}%`"></div>
                                                    <div class="trend-seg trend-skipped" :style="`height:${d.skipped/d.total*100}%`"></div>
                                                    <div class="trend-seg trend-done" :style="`height:${d.done/d.total*100}%`"></div>
                                                </div>
                                                <span class="trend-label" x-text="d.label"></span>
                                            </div>
                                        </template>
                                    </div>
                                </div>

                            </div>
                        </template>

                        <!-- Task modal (add + edit both use this). Tiered layout:
                             eyebrow (identity) + name-as-title + status pill,
                             Schedule subsection, Assignment subsection, actions
                             row with Delete bottom-left and Cancel/Save right.
                             (Round 2 build, item 13.) -->
                        <template x-if="taskModalOpen">
                            <div class="modal-overlay" @click.self="closeTaskModal()">
                                <div class="modal task-edit-modal">
                                    <div class="task-edit-hero">
                                        <div class="task-edit-hero-left">
                                            <div class="task-edit-eyebrow" :class="{ reminder: taskForm.kind==='reminder' }">
                                                <span x-text="editingTaskId ? (taskForm.kind==='reminder' ? 'Edit reminder' : 'Edit task') : (taskForm.kind==='reminder' ? 'New reminder' : 'New task')"></span>
                                                <template x-if="editingTaskId && taskForm.projectId">
                                                    <span> · <span x-text="(projects.find(p => p.id === taskForm.projectId) || {}).name || ''"></span></span>
                                                </template>
                                            </div>
                                            <input class="task-edit-name-input" type="text" x-model="taskForm.name" placeholder="What do you need to do?" autofocus>
                                        </div>
                                        <template x-if="editingTaskId">
                                            <span class="task-edit-status" :class="{ 'in-progress': (tasks.find(t => t.id === editingTaskId) || {}).status === 'in_progress', 'done': (tasks.find(t => t.id === editingTaskId) || {}).status === 'done' }" x-text="((tasks.find(t => t.id === editingTaskId) || {}).status === 'in_progress' ? 'In progress' : ((tasks.find(t => t.id === editingTaskId) || {}).status === 'done' ? 'Done' : 'Not started'))"></span>
                                        </template>
                                    </div>

                                    <div class="modal-section-lbl">Schedule</div>
                                    <div class="field-row">
                                        <div class="field"><label>Date</label><input type="date" x-model="taskForm.date"></div>
                                        <div class="field"><label>Time</label>
                                            <div class="tp-numeric" x-data="timePicker12h" x-modelable="value" x-model="taskForm.time">
                                                <input type="tel" :value="hh" @input="updateHH($event.target.value)" maxlength="2" placeholder="12" inputmode="numeric" aria-label="Hour"><span class="colon">:</span><input type="tel" :value="mm" @input="updateMM($event.target.value)" maxlength="2" placeholder="00" inputmode="numeric" aria-label="Minute"><div class="tp-ampm" role="group" aria-label="AM or PM"><button type="button" @click.prevent="updateAMPM('AM')" :aria-pressed="ampm === 'AM'">AM</button><button type="button" @click.prevent="updateAMPM('PM')" :aria-pressed="ampm === 'PM'">PM</button></div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="field-checkbox"><label><input type="checkbox" x-model="taskForm.notify"> Notify me at this time</label></div>

                                    <div class="modal-section">
                                        <div class="modal-section-lbl">Assignment</div>
                                        <div class="field-row">
                                            <div class="field">
                                                <label>Type</label>
                                                <select :value="taskForm.kind" @change="taskForm.kind = $event.target.value">
                                                    <option value="task">Task</option>
                                                    <option value="reminder">Reminder</option>
                                                </select>
                                            </div>
                                            <div class="field">
                                                <label>Project</label>
                                                <select x-model="taskForm.projectId">
                                                    <option value="">Standalone</option>
                                                    <template x-for="p in projects" :key="p.id"><option :value="p.id" x-text="p.name"></option></template>
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="task-edit-actions">
                                        <template x-if="editingTaskId">
                                            <div style="display: flex; gap: 16px;">
                                                <button class="task-edit-delete" @click="deleteFromEditModal()" x-text="taskForm.kind==='reminder' ? 'Delete reminder' : 'Delete task'"></button>
                                                <button class="btn-text" style="color: var(--text-secondary);" x-show="taskForm.kind==='task' && (tasks.find(t => t.id === editingTaskId) || {}).status === 'in_progress'" @click="pauseTask()">Pause task</button>
                                            </div>
                                        </template>
                                        <template x-if="!editingTaskId"><span></span></template>
                                        <div class="task-edit-actions-right">
                                            <button class="btn-text" @click="closeTaskModal()">Cancel</button>
                                            <button class="btn btn-primary" @click="submitTask()" x-text="editingTaskId ? 'Save' : 'Add'"></button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- Relapse modal -->
                        <template x-if="relapseTarget">
                            <div class="modal-overlay" @click.self="closeRelapseModal()">
                                <div class="modal">
                                    <h2 x-text="'Log ' + relapseTarget.name.toLowerCase() + ' relapse?'"></h2>
                                    <p class="system-text" x-text="`Your ${daysFor(relapseTarget)}-day streak will reset to 0 — unless you use a grace day.`"></p>
                                    <div class="field"><label>Reason (required)</label><input type="text" x-model="relapseForm.reason" placeholder="What happened?"></div>
                                    <div class="field-error" x-show="relapseError" x-text="relapseError"></div>
                                    <template x-if="!relapseTarget.grace_used">
                                        <div class="field-checkbox"><label><input type="checkbox" x-model="relapseForm.useGrace"> Use grace day — keep the streak alive</label></div>
                                    </template>
                                    <div class="modal-actions">
                                        <button class="btn-text" @click="closeRelapseModal()">Cancel</button>
                                        <button class="btn btn-primary" style="background: var(--accent-coral); border-color: var(--accent-coral);" @click="confirmRelapse()">Confirm</button>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- Sleep modal -->
                        <template x-if="sleepModalOpen">
                            <div class="modal-overlay" @click.self="closeSleepModal()">
                                <div class="modal">
                                    <h2>Log sleep</h2>
                                    <div class="field">
                                        <label>Duration</label>
                                        <div style="display:flex; gap: var(--pad-sm);">
                                            <input type="number" x-model="sleepForm.hours" placeholder="Hours" min="0" max="24" style="flex:1;">
                                            <input type="number" x-model="sleepForm.minutes" placeholder="Minutes" min="0" max="59" style="flex:1;">
                                        </div>
                                    </div>
                                    <div class="field-row">
                                        <div class="field"><label>Sleep score</label><input type="number" x-model="sleepForm.score" min="0" max="100"></div>
                                        <div class="field"><label>Resting HR</label><input type="number" x-model="sleepForm.restingHr" min="0"></div>
                                    </div>
                                    <div class="field-row">
                                        <div class="field"><label>Deep sleep (min)</label><input type="number" x-model="sleepForm.deep" min="0"></div>
                                        <div class="field"><label>REM sleep (min)</label><input type="number" x-model="sleepForm.rem" min="0"></div>
                                    </div>
                                    <div class="field"><label>HRV</label><input type="number" x-model="sleepForm.hrv" min="0" step="0.1"></div>
                                    <div class="field"><label>Note (optional)</label><input type="text" x-model="sleepForm.note"></div>
                                    <div class="modal-actions">
                                        <button class="btn-text" @click="closeSleepModal()">Cancel</button>
                                        <button class="btn btn-primary" @click="saveSleep()">Save</button>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- Workout modal -->
                        <template x-if="workoutModalOpen">
                            <div class="modal-overlay" @click.self="closeWorkoutModal()">
                                <div class="modal">
                                    <h2>Log workout</h2>
                                    <div class="field-row">
                                        <div class="field"><label>Workout score</label><input type="number" x-model="workoutForm.score" min="0" max="100"></div>
                                        <div class="field"><label>Type</label><input type="text" x-model="workoutForm.type" placeholder="Strength, Cardio, Walk…"></div>

                        <template x-if="project">

                                            <div class="ws-metric-sub" x-text="inProgressCount + ' in progress · ' + (pausedCount ? pausedCount + ' paused · ' : '') + notStartedCount + ' to start'"></div>

                                            <div class="ws-metric">

                                                <div class="ws-metric-sub" x-text="daysUntil(project.short_term_goal_date)"></div>

                                                <div class="ws-metric-sub" x-text="daysUntil(project.long_term_goal_date)"></div>

                        <div class="field-error" x-show="errorMsg" x-text="errorMsg"></div>

                                <!-- Tasks section -- same trv2-row anatomy as Today.
                                     Delete button removed from rows (Round 2 build,
                                     item 9); persistent add-task row removed (item 10)
                                     -- adding a task opens the modal below via the
                                     "+ Add task" head-action. -->
                                <div class="ws-section">

                                        <h2>Tasks</h2>

                                                <div class="trv2-row" :class="{ 'is-done': task.status==='done' }" @click="project.status === 'completed' ? null : openEditTaskModal(task)" role="button" tabindex="0" @keydown.enter.prevent="project.status === 'completed' ? null : openEditTaskModal(task)" @keydown.space.prevent="project.status === 'completed' ? null : openEditTaskModal(task)" :aria-label="'Edit task: ' + task.name" style="grid-template-columns: auto minmax(0, 1fr) auto;">
                                                    <button class="trv2-check" :disabled="project.status === 'completed'" :class="{ 'is-pending': isPendingComplete(task), 'is-done': task.status==='done' }" @click.stop="(task.status==='done' || project.status === 'completed') ? null : handleCompleteClick(task)" :aria-label="task.status==='done' ? 'Already done' : (isPendingComplete(task) ? 'Confirm mark done' : 'Mark done')" :title="task.status==='done' ? 'Already done' : (isPendingComplete(task) ? 'Tap again to confirm' : 'Mark done')">
                                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                                                    </button>
                                                    <div class="trv2-body">
                                                        <div class="trv2-name" x-text="task.name"></div>
                                                        <div class="trv2-meta">
                                                            <span class="trv2-kind task" x-text="task.status==='in_progress' ? 'Task · In progress' : (task.status==='done' ? 'Task · Done' : (task.status==='paused' ? 'Task · Paused' : 'Task'))"></span>
                                                            <template x-if="task.status==='not_started' || task.status==='paused'">
                                                                <button class="trv2-start" @click.stop="startTask(task)" :title="task.status==='paused' ? 'Resume task' : 'Start task'" x-text="task.status==='paused' ? '▶ Resume' : '▶ Start'"></button>
                                                            </template>
                                                            <template x-if="isPendingComplete(task)">
                                                                <span class="trv2-confirm-hint">Tap ✓ again to confirm</span>
                                                            </template>
                                                        </div>

                                                    </div>
                                                </div>
                                                <p class="task-note" x-show="task.status==='done' && task.completion_note" x-text="task.completion_note" style="padding: 4px 12px 8px 54px; color: var(--text-muted); font-size: 13px; font-style: italic;"></p>
                                            </div>

                                                                </div>
                                                            </template>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>

                        <!-- Workspace task modal (add + edit). Same shape as
