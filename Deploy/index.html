                                    </div>
                                    <template x-if="project.status !== 'completed'">
                                        <div>
                                            <div class="field"><textarea x-model="newLogBody" rows="2" placeholder="Add a note about today's work"></textarea></div>
                                            <div class="modal-actions" style="justify-content: flex-start; margin-bottom: var(--pad-md);">
                                                <button class="btn btn-primary" @click="addLog()">Add entry</button>
                                            </div>
                                        </div>
                                    </template>

                                    <!-- Insight Pill (Phase 5 close-out polish) -- just the single
                                         most recent entry, always visible regardless of which date
                                         group is expanded below. Also still appears normally in its
                                         own day group -- same "highlight duplicates what's in the
                                         full list" pattern already used by Running Now + Tasks. -->
                                    <template x-if="mostRecentLog">
                                        <div class="insight-pill" style="margin-bottom: var(--pad-md);">
                                            <div class="insight-pill-head">
                                                <span class="insight-pill-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span>
                                                <span class="insight-pill-label">Latest update</span>
                                            </div>
                                            <p class="insight-pill-body" x-text="mostRecentLog.body"></p>
                                        </div>
                                    </template>

                                    <template x-for="group in logGroups" :key="group.date">
                                        <div class="worklog-day">
                                            <button class="worklog-day-head" @click="toggleDate(group.date)">
                                                <span x-text="group.date"></span>
                                                <span x-text="group.entries.length + ' · ' + (isDateExpanded(group.date) ? '−' : '+')"></span>
                                            </button>
                                            <template x-if="isDateExpanded(group.date)">
                                                <div>
                                                    <template x-for="log in group.entries" :key="log.id">
                                                        <div>
                                                            <template x-if="editingLogId !== log.id">
                                                                <div class="worklog-line">
                                                                    <span class="worklog-line-time" x-text="formatTime(log.created_at)"></span>
                                                                    <span :class="log.entry_type==='task_completion' ? 'worklog-line-body system' : 'worklog-line-body'" x-text="log.body"></span>
                                                                    <button class="worklog-line-edit" x-show="project.status !== 'completed'" @click="startEditLog(log)">Edit</button>
                                                                </div>
                                                            </template>
                                                            <template x-if="editingLogId === log.id">
                                                                <div style="padding: 10px 0; border-bottom: 1px solid var(--border);">
                                                                    <div class="field"><textarea x-model="editingLogBody" rows="2"></textarea></div>
                                                                    <div class="modal-actions">
                                                                        <button class="btn-text" @click="cancelEditLog()">Cancel</button>
                                                                        <button class="btn btn-primary" @click="saveEditLog(log)">Save</button>
                                                                    </div>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>

                            </div>
                        </template>

                        <!-- Workspace task modal (add + edit). Same shape as
                             Today's task modal (Round 2 build, item 13). Project
                             field is auto-locked here since the task always belongs
                             to this workspace's project. -->
                        <template x-if="taskModalOpen">
                            <div class="modal-overlay" @click.self="closeTaskModal()">
                                <div class="modal task-edit-modal">
                                    <div class="task-edit-hero">
                                        <div class="task-edit-hero-left">
                                            <div class="task-edit-eyebrow">
                                                <span x-text="editingTaskId ? 'Edit task' : 'New task'"></span>
                                                <template x-if="project"><span> · <span x-text="project.name"></span></span></template>
                                            </div>
                                            <input class="task-edit-name-input" type="text" x-model="taskForm.name" placeholder="What do you need to do?" autofocus>
                                        </div>
                                        <template x-if="editingTaskId">
                                            <span class="task-edit-status" :class="{ 'in-progress': (tasks.find(t => t.id === editingTaskId) || {}).status === 'in_progress', 'done': (tasks.find(t => t.id === editingTaskId) || {}).status === 'done' }" x-text="((tasks.find(t => t.id === editingTaskId) || {}).status === 'in_progress' ? 'In progress' : ((tasks.find(t => t.id === editingTaskId) || {}).status === 'done' ? 'Done' : 'Not started'))"></span>
                                        </template>
                                    </div>

                                    <div class="modal-section-lbl">Schedule</div>
                                    <div class="field-row">
                                        <div class="field"><label>Date</label><input type="date" x-model="taskForm.scheduled_date"></div>
                                        <div class="field"><label>Time</label>
                                            <div class="tp-numeric" x-data="timePicker12h" x-modelable="value" x-model="taskForm.scheduled_time">
                                                <select :value="hh" @change="updateHH($event.target.value)" aria-label="Hour"><option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option><option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option></select><span class="colon">:</span><select :value="mm" @change="updateMM($event.target.value)" aria-label="Minute"><option value="00">00</option><option value="15">15</option><option value="30">30</option><option value="45">45</option></select><div class="tp-ampm" role="group" aria-label="AM or PM"><button type="button" @click.prevent="updateAMPM('AM')" :aria-pressed="ampm === 'AM'">AM</button><button type="button" @click.prevent="updateAMPM('PM')" :aria-pressed="ampm === 'PM'">PM</button></div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="field-checkbox"><label><input type="checkbox" x-model="taskForm.notify_enabled"> Notify me at this time</label></div>

                                    <div class="task-edit-actions">
                                        <template x-if="editingTaskId">
                                            <div style="display: flex; gap: 16px;">
                                                <button class="task-edit-delete" @click="deleteFromEditModal()">Delete task</button>
                                                <button class="btn-text" style="color: var(--text-secondary);" x-show="(tasks.find(t => t.id === editingTaskId) || {}).status === 'in_progress'" @click="pauseTask()">Pause task</button>
                                            </div>
                                        </template>
                                        <template x-if="!editingTaskId"><span></span></template>
                                        <div class="task-edit-actions-right">
                                            <button class="btn-text" @click="closeTaskModal()">Cancel</button>
                                            <button class="btn btn-primary" @click="submitTaskModal()" x-text="editingTaskId ? 'Save' : 'Add'"></button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- Goal edit modal. Opened from clicking either goal
                             block in the hero, or the ⋯ menu's "Edit goals". -->
                        <template x-if="editingHeader">
                            <div class="modal-overlay" @click.self="editingHeader = false">
                                <div class="modal" style="max-width: 520px;">
                                    <h2 style="font-family: var(--font-sans); font-size: 17px; margin: 0 0 4px;">Edit goals</h2>
                                    <p style="color: var(--text-muted); font-size: 12.5px; margin: 0 0 20px;">Short-term is what you're pushing for now. Long-term is the destination.</p>
                                    <div class="modal-section-lbl" style="color: var(--accent-sage);">Short-term goal</div>
                                    <div class="field">
                                        <label>Goal</label>
                                        <textarea x-model="headerForm.short_term_goal" rows="2" placeholder="What are you shipping first?"></textarea>
                                    </div>
                                    <div class="field">
                                        <label>Target date</label>
                                        <input type="date" x-model="headerForm.short_term_goal_date">
                                    </div>
                                    <div class="modal-section">
                                        <div class="modal-section-lbl" style="color: var(--accent-blue);">Long-term goal</div>
                                        <div class="field">
                                            <label>Goal</label>
                                            <textarea x-model="headerForm.long_term_goal" rows="2" placeholder="Where does this project end up?"></textarea>
                                        </div>
                                        <div class="field">
                                            <label>Target date</label>
                                            <input type="date" x-model="headerForm.long_term_goal_date">
                                        </div>
                                    </div>
                                    <div class="modal-actions">
                                        <button class="btn-text" @click="editingHeader = false">Cancel</button>
                                        <button class="btn btn-primary" @click="saveHeader()">Save</button>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

            </main>

            <!-- Undo toast host -->
            <div class="toast-container" x-data="undoToastHost()">
                <template x-for="toast in toasts" :key="toast.id">
                    <div class="toast">
                        <span x-text="toast.message"></span>
                        <button @click="undo(toast)">Undo</button>
                    </div>
                </template>
            </div>

            <!-- Confirm dialog host: replaces browser confirm() everywhere -->
            <div x-data="confirmDialogHost()">
                <template x-if="dialog">
                    <div class="modal-overlay" @click.self="respond(false)">
                        <div class="modal">
                            <h2>Are you sure?</h2>
                            <p class="project-focus" x-text="dialog.message"></p>
                            <div class="modal-actions">
                                <button class="btn-text" x-show="dialog.cancelLabel" @click="respond(false)" x-text="dialog.cancelLabel"></button>
                                <button class="btn" :class="dialog.isDanger ? 'btn-danger' : 'btn-primary'" @click="respond(true)" x-text="dialog.confirmLabel"></button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Note prompt host: replaces browser prompt() everywhere -->
            <div x-data="notePromptHost()">
                <template x-if="dialog">
                    <div class="modal-overlay" @click.self="cancel()">
                        <div class="modal">
                            <h2 x-text="dialog.message"></h2>
                            <div class="field">
                                <textarea x-model="dialog.value" rows="3" :placeholder="dialog.placeholder" @keydown.ctrl.enter="submit()"></textarea>
                            </div>
                            <div class="modal-actions">
                                <button class="btn-text" @click="cancel()">Cancel</button>
                                <button class="btn-text" @click="skip()" x-text="dialog.skipLabel"></button>
                                <button class="btn btn-primary" @click="submit()" x-text="dialog.submitLabel"></button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </template>

</body>
</html>
