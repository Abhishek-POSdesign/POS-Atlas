                                    <div class="field"><label>Reason (required)</label><input type="text" x-model="relapseForm.reason" placeholder="What happened?"></div>
                                    <div class="field-error" x-show="relapseError" x-text="relapseError"></div>
                                    <template x-if="!relapseTarget.grace_used">
                                        <div class="field-checkbox"><label><input type="checkbox" x-model="relapseForm.useGrace"> Use grace day — keep the streak alive</label></div>
                                    </template>
                                    <div class="modal-actions">
                                        <button class="btn-text" @click="closeRelapseModal()">Cancel</button>
                                        <button class="btn btn-primary" style="background: var(--accent-coral); border-color: var(--accent-coral);" @click="confirmRelapse()">Confirm</button>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- Sleep modal -->
                        <template x-if="sleepModalOpen">
                            <div class="modal-overlay" @click.self="closeSleepModal()">
                                <div class="modal">

                                    <!-- Step 1: Metrics -->
                                    <template x-if="sleepStep === 1">
                                        <div>
                                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                                                <h2 style="margin:0;">Log sleep · Metrics</h2>
                                                <span class="sleep-step-indicator">1 / 2</span>
                                            </div>
                                            <div class="field">
                                                <label>Duration</label>
                                                <div style="display:flex; gap: var(--pad-sm);">
                                                    <input type="number" x-model="sleepForm.hours" placeholder="Hours" min="0" max="24" style="flex:1;">
                                                    <input type="number" x-model="sleepForm.minutes" placeholder="Minutes" min="0" max="59" style="flex:1;">
                                                </div>
                                            </div>
                                            <div class="field-row">
                                                <div class="field"><label>Sleep score</label><input type="number" x-model="sleepForm.score" min="0" max="100"></div>
                                                <div class="field"><label>Resting HR</label><input type="number" x-model="sleepForm.restingHr" min="0"></div>
                                            </div>
                                            <div class="field-row">
                                                <div class="field"><label>Deep sleep (min)</label><input type="number" x-model="sleepForm.deep" min="0"></div>
                                                <div class="field"><label>REM sleep (min)</label><input type="number" x-model="sleepForm.rem" min="0"></div>
                                            </div>
                                            <div class="field"><label>HRV</label><input type="number" x-model="sleepForm.hrv" min="0" step="0.1"></div>
                                            <details class="sleep-context-details">
                                                <summary>Context note (optional)</summary>
                                                <div class="field" style="margin-top:8px;"><input type="text" x-model="sleepForm.note" placeholder="e.g. took melatonin"></div>
                                            </details>
                                            <div class="modal-actions">
                                                <button class="btn-text" @click="closeSleepModal()">Cancel</button>
                                                <div style="display:flex; gap:8px;">
                                                    <button class="btn btn-secondary" @click="saveSleepStep1()">Save</button>
                                                    <button class="btn btn-primary" @click="advanceSleepToStep2()">Next →</button>
                                                </div>
                                            </div>
                                        </div>
                                    </template>

                                    <!-- Step 2: Morning reflection -->
                                    <template x-if="sleepStep === 2">
                                        <div>
                                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                                                <h2 style="margin:0;">Log sleep · Reflection</h2>
                                                <span class="sleep-step-indicator">2 / 2</span>
                                            </div>
                                            <div class="field">
                                                <label>Morning reflection</label>
                                                <textarea x-model="sleepForm.morningNote" placeholder="How do you feel this morning?" rows="4" style="width:100%; resize:vertical;"></textarea>
                                            </div>
                                            <div class="modal-actions">
                                                <button class="btn-text" @click="sleepStep = 1">← Back</button>
                                                <button class="btn btn-primary" @click="saveSleep()">Save</button>
                                            </div>
                                        </div>
                                    </template>

                                </div>
                            </div>
                        </template>

                        <!-- Workout modal -->
                        <template x-if="workoutModalOpen">
                            <div class="modal-overlay" @click.self="closeWorkoutModal()">
                                <div class="modal">
                                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                                        <h2 style="margin: 0;">Workout Sessions</h2>
                                        <button class="btn btn-primary" x-show="!showSessionForm" @click="openWorkoutSessionForm()">+ Add</button>
                                    </div>
                                    
                                    <template x-if="!showSessionForm">
                                        <div class="stack">
                                            <!-- Day-level summary fields -- workout_score/calories/vo2_max
                                                 already existed as data (read by workoutSummary/hasWorkoutData)
                                                 with no manual edit path anywhere in the app until now. One
                                                 compact inline row (placeholders, not stacked labels) so this
                                                 doesn't grow the modal's height (2026-07-29 feedback). -->
                                            <div style="display:flex; gap:8px; align-items:center; margin-bottom:14px;">
                                                <input type="number" x-model="workoutDetailsForm.score" placeholder="Score" min="0" max="100" style="flex:1; min-width:0;">
                                                <input type="number" x-model="workoutDetailsForm.calories" placeholder="Calories" min="0" style="flex:1; min-width:0;">
                                                <input type="number" x-model="workoutDetailsForm.vo2max" placeholder="VO2 max" min="0" step="0.1" style="flex:1; min-width:0;">
                                                <button type="button" class="btn-text" @click="saveWorkoutDetails()" style="flex-shrink:0;">Save</button>
                                            </div>
                                            <template x-if="workoutSessions.length === 0">
                                                <div class="empty-state">No sessions logged yet.</div>
                                            </template>
                                            <template x-for="session in workoutSessions" :key="session.id">
                                                <div class="card panel" style="padding: 16px; margin-bottom: 12px;">
                                                    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                                        <div>
                                                            <div style="font-weight: 600; text-transform: capitalize;" x-text="session.activity_type.replace('_', ' ')"></div>
                                                            <div class="meta" style="color: var(--text-muted); font-size: 13px; margin-top: 4px;">
                                                                <span x-text="session.duration_minutes + ' min'"></span>
                                                                <template x-if="session.activity_type === 'strength' && session.intensity">
                                                                    <span x-text="' · ' + session.intensity"></span>
                                                                </template>
                                                                <template x-if="session.program_tag">
                                                                    <span x-text="' · ' + session.program_tag"></span>
                                                                </template>
                                                            </div>
                                                            <template x-if="session.note">
                                                                <div style="color: var(--text-secondary); font-size: 13px; margin-top: 8px; font-style: italic;" x-text="session.note"></div>
                                                            </template>
                                                        </div>
                                                        <div style="display: flex; gap: 8px;">
                                                            <button class="btn-text" @click.stop="openWorkoutSessionForm(session)">Edit</button>
                                                            <button class="btn-text" @click.stop="deleteWorkoutSession(session.id)" style="color: var(--accent-coral);">Delete</button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </template>
                                            <div class="modal-actions" style="margin-top: 16px;">
                                                <button class="btn-text" @click="closeWorkoutModal()">Close</button>
                                            </div>
                                        </div>
                                    </template>

                                    <template x-if="showSessionForm">
                                        <div>
                                            <div class="field">
                                                <label>Activity Type</label>
                                                <select x-model="workoutSessionForm.type">

                                                    <option value="cardio_walk">Cardio / Walk</option>
                                                    <option value="yoga_stretch">Yoga / Stretch</option>
                                                    <option value="active_play">Active Play</option>
                                                    <option value="cleaning">Cleaning</option>
                                                </select>
                                            </div>
                                            <div class="field-row">
                                                <div class="field"><label>Duration (minutes)</label><input type="number" x-model="workoutSessionForm.duration" min="1"></div>

                                                    <div class="field">
                                                        <label>Intensity</label>
                                                        <select x-model="workoutSessionForm.intensity">
                                                            <option value="">(None)</option>
                                                            <option value="light">Light</option>
                                                            <option value="moderate">Moderate</option>
                                                            <option value="hard">Hard</option>
                                                        </select>
                                                    </div>
                                                </template>
                                            </div>
                                            <template x-if="workoutSessionForm.type === 'strength'">
                                                <div class="field">
                                                    <label>Program Tag</label>
                                                    <select x-model="workoutSessionForm.programTag">
                                                        <option value="">(None)</option>
                                                        <option value="upper">Upper</option>
                                                        <option value="lower">Lower</option>
                                                        <option value="push">Push</option>
                                                        <option value="pull">Pull</option>
                                                        <option value="legs">Legs</option>
                                                        <option value="full_body">Full Body</option>
                                                    </select>
                                                </div>
                                            </template>
                                            <div class="field"><label>Note (optional)</label><input type="text" x-model="workoutSessionForm.note"></div>
                                            <div class="modal-actions" style="margin-top: 16px;">
                                                <button class="btn-text" @click="closeWorkoutSessionForm()">Cancel</button>
                                                <button class="btn btn-primary" @click="saveWorkoutSession()">Save Session</button>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>

                        <!-- Weekly targets editor modal -->

                    </div>
                </template>
                <!-- Projects tab -->
                <template x-if="tab==='projects' && !projectViewId">
                    <div x-data="projectsListPage({ onOpen: (id) => openProject(id) })">

                            <button class="btn btn-primary" @click="openCreate()">+ New project</button>
                        </div>
                        <div class="field-error" x-show="errorMsg" x-text="errorMsg"></div>
                        <template x-if="loading"><p>Loading…</p></template>

                            <div class="empty-state">
                                <h1>No projects yet</h1>
                                <p>Create your first project to get a real workspace for it.</p>
                            </div>

                                <template x-for="group in [

                                            <template x-for="p in group.list" :key="p.id">

                                                     x-data="projectCard(p, tasksFor(p.id), { onOpen: openWorkspace, onEdit: openEdit, onDelete: softDelete })"
                                                     :class="{ expanded: expanded, 'project-card-completed': p.status === 'completed' }"
                                     @click="handleClick()">
                                    <div class="project-card-top">
                                          <div class="monogram-chip" :class="p.status === 'completed' ? 'color-lilac' : 'color-' + project.color_key">

                                                  <span x-text="initial"></span>

                                              <template x-if="p.status === 'completed'">
                                                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>

                                          </div>

                                      <template x-if="p.status !== 'completed'">
                                          <p class="project-focus" x-show="project.description" x-text="project.description"></p>

                                          <span class="pstatus-chip">Completed</span>
                                      </template>

                                      <div class="project-meta" x-show="p.status !== 'completed'">
                                          <span class="status-text" :class="'color-' + project.color_key" x-text="statusLabel"></span>
                                          <span class="open-cue" x-text="expanded ? 'Click to open →' : 'Details →'"></span>
                                      </div>
                                      <div class="project-meta" x-show="p.status === 'completed'">
                                          <span class="status-text"></span>
                                          <span class="open-cue" x-text="expanded ? 'Click to open →' : 'Details →'"></span>

                                    <button class="icon-button project-card-kebab" @click.stop="toggleMenu()">⋮</button>

                                            </p>
                                            <p class="project-focus" x-show="!runningTask && !nextTask">No tasks yet.</p>
                                            <button class="btn-text" style="margin-top: 4px;" @click.stop="openWorkspace()">Open →</button>
                                        </div>
                                    </template>
                                </div>
                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <div style="margin-top: var(--pad-lg); display: flex; justify-content: flex-end;">

                                                        <span class="user-text" x-text="note.body"></span>

                            </div>

                        <!-- Note modal -->
                        <template x-if="showNoteModal">

                                    <p style="color: var(--text-muted); font-size: 12.5px; margin: 0 0 20px;">A note about your projects in general.</p>
                                    <div class="field">
                                        <label>Note</label>
                                        <textarea x-model="newNoteBody" rows="4" placeholder="What's on your mind about your projects?" autofocus></textarea>
                                    </div>
                                    <div class="modal-actions">
                                        <button class="btn-text" @click="closeNoteModal()">Cancel</button>
                                        <button class="btn btn-primary" @click="addNote()">Save note</button>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <template x-if="showModal">
                            <div class="modal-overlay" @click.self="closeModal()">
                                <div class="modal" style="max-width: 500px;">
                                    <h2 style="font-family: var(--font-sans); font-size: 17px; margin: 0 0 4px;" x-text="editingProject ? 'Edit project' : 'New project'"></h2>
                                    <p style="color: var(--text-muted); font-size: 12.5px; margin: 0 0 20px;">Set it up fully now, or come back and fill in goals later.</p>

                                    <div class="field">
                                        <label>Name</label>
                                        <input type="text" x-model="form.name" placeholder="Project name">
                                    </div>
                                    <div class="field-row">
                                        <div class="field">
                                            <label>Color</label>
                                            <div class="color-swatches">
                                                <template x-for="key in colorKeys" :key="key">
                                                    <div class="color-swatch" :class="'color-' + key + (form.color_key === key ? ' selected' : '')" @click="form.color_key = key"></div>
                                                </template>
                                            </div>
                                        </div>
                                        <div class="field">
                                            <label>Monogram (optional)</label>
                                            <input type="text" x-model="form.monogram_letter" maxlength="1" placeholder="First letter of name">

                                    </div>
                                    <div class="field">
                                        <label>Description (optional)</label>
                                        <textarea x-model="form.description" rows="2" placeholder="One-line description"></textarea>
                                    </div>

                                        <div class="modal-section-lbl">Goals (optional)</div>

                                            <label>Short-term goal</label>
