                                        </div>
                                        <div class="field">
                                            <label>Short-term target date</label>
                                            <input type="date" x-model="form.short_term_goal_date">
                                        </div>
                                        <div class="field" style="margin-top: var(--pad-md);">
                                            <label>Long-term goal</label>
                                            <textarea x-model="form.long_term_goal" rows="2" placeholder="Where does this project end up?"></textarea>
                                        </div>
                                        <div class="field">
                                            <label>Long-term target date</label>
                                            <input type="date" x-model="form.long_term_goal_date">
                                        </div>
                                    </div>

                                    <div class="field-error" x-show="errorMsg" x-text="errorMsg"></div>
                                    <div class="modal-actions">
                                        <button class="btn-text" @click="closeModal()">Cancel</button>
                                        <button class="btn btn-primary" @click="submitForm()" x-text="editingProject ? 'Save' : 'Create project'"></button>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- Projects tab: workspace (redesigned 2026-07-26, mockup approved) -->
                <template x-if="!overlay && tab==='projects' && projectViewId">
                    <div x-data="projectWorkspacePage({ onBack: () => closeProject() })" x-init="open(projectViewId)">

                        <button class="ws-back" @click="back()" aria-label="Back to Projects">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                            Projects
                        </button>

                        <!-- Hero header block. Left side unchanged (title, description,
                             task metrics, progress bar). Right side (Round 2 build,
                             item 8): the ⋯ overflow menu on top, then Short-term Goal
                             (sage left-edge accent) and Long-term Goal (blue left-edge)
                             stacked below. Dates deliberately omitted from the goal
                             blocks -- the Short/Long-term due countdowns in the metrics
                             row on the left already carry that data. The separate
                             "Goals" section that used to live below the hero is gone.
                             Clicking any goal opens the shared goal-edit modal. -->
                        <template x-if="project">
                            <div class="ws-hero">
                                <div class="ws-hero-left">
                                    <div class="ws-title-row">
                                        <span class="ws-dot" :class="projectDotClass()"></span>
                                        <h1 class="ws-title" x-text="project.name"></h1>
                                        <span class="ws-status-pill" :class="'status-' + project.status" x-text="statusLabel(project.status)"></span>
                                    </div>
                                    <template x-if="project.description">
                                        <p class="ws-desc" x-text="project.description"></p>
                                    </template>
                                    <template x-if="!project.description">
                                        <p class="ws-desc empty">No description yet.</p>
                                    </template>

                                    <div class="ws-summary">
                                        <div class="ws-metric">
                                            <div class="ws-metric-lbl">Tasks</div>
                                            <div class="ws-metric-val"><span x-text="doneCount"></span><span class="denom" x-text="'/' + totalCount"></span></div>
                                            <div class="ws-metric-sub" x-text="inProgressCount + ' in progress · ' + (pausedCount ? pausedCount + ' paused · ' : '') + notStartedCount + ' to start'"></div>
                                        </div>
                                        <template x-if="project.short_term_goal_date">
                                            <div class="ws-metric">
                                                <div class="ws-metric-lbl">Short-term due</div>
                                                <div class="ws-metric-val small" x-text="formatDate(project.short_term_goal_date)"></div>
                                                <div class="ws-metric-sub" x-text="daysUntil(project.short_term_goal_date)"></div>
                                            </div>
                                        </template>
                                        <template x-if="project.long_term_goal_date">
                                            <div class="ws-metric">
                                                <div class="ws-metric-lbl">Long-term due</div>
                                                <div class="ws-metric-val small" x-text="formatDate(project.long_term_goal_date)"></div>
                                                <div class="ws-metric-sub" x-text="daysUntil(project.long_term_goal_date)"></div>
                                            </div>
                                        </template>
                                    </div>
                                    <template x-if="totalCount > 0">
                                        <div class="ws-progress" :aria-label="doneCount + ' of ' + totalCount + ' tasks done'">
                                            <div class="ws-progress-fill" :style="`width: ${progressPct}%`"></div>
                                        </div>
                                    </template>
                                </div>

                                <div class="ws-right">
                                    <div class="ws-overflow" x-data="{ menuOpen: false }" @click.outside="menuOpen = false">
                                        <button class="ws-overflow-btn" @click.stop="menuOpen = !menuOpen" aria-haspopup="menu" :aria-expanded="menuOpen" aria-label="Project actions">⋯</button>
                                        <template x-if="menuOpen">
                                            <div class="ws-overflow-menu" role="menu">
                                                <button role="menuitem" x-show="project.status !== 'completed'" @click="startEditHeader(); menuOpen = false">Edit goals</button>
                                                <button role="menuitem" x-show="project.status !== 'completed'" @click="completeProject(); menuOpen = false">Mark as completed</button>
                                                <button role="menuitem" x-show="project.status === 'completed'" @click="reopenProject(); menuOpen = false">Reopen project</button>
                                                <button role="menuitem" x-show="!project.archived_at" @click="archiveProject(); menuOpen = false">Archive project</button>
                                                <hr>
                                                <button role="menuitem" class="danger" @click="menuOpen = false; softDeleteProject()">Delete project</button>
                                            </div>
                                        </template>
                                    </div>

                                    <!-- Insight Pills (Phase 5 close-out polish) -- replaces the old
                                         colored-left-edge .ws-goal treatment. Same click/keyboard
                                         behavior, same startEditHeader() modal; only the container
                                         visuals changed to match the Health chip/session pills. -->
                                    <div class="insight-pill clickable goal" role="button" tabindex="0" @click="project.status !== 'completed' ? startEditHeader() : null" @keydown.enter.prevent="project.status !== 'completed' ? startEditHeader() : null" @keydown.space.prevent="project.status !== 'completed' ? startEditHeader() : null" aria-label="Edit short-term goal">
                                        <div class="insight-pill-head">
                                            <span class="insight-pill-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg></span>
                                            <span class="insight-pill-label">Short-term goal</span>
                                        </div>
                                        <template x-if="project.short_term_goal">
                                            <p class="insight-pill-body" x-text="project.short_term_goal"></p>
                                        </template>
                                        <template x-if="!project.short_term_goal">
                                            <p class="insight-pill-body inactive">Not set — click to add.</p>
                                        </template>
                                    </div>
                                    <div class="insight-pill clickable goal" role="button" tabindex="0" @click="project.status !== 'completed' ? startEditHeader() : null" @keydown.enter.prevent="project.status !== 'completed' ? startEditHeader() : null" @keydown.space.prevent="project.status !== 'completed' ? startEditHeader() : null" aria-label="Edit long-term goal">
                                        <div class="insight-pill-head">
                                            <span class="insight-pill-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></span>
                                            <span class="insight-pill-label">Long-term goal</span>
                                        </div>
                                        <template x-if="project.long_term_goal">
                                            <p class="insight-pill-body" x-text="project.long_term_goal"></p>
                                        </template>
                                        <template x-if="!project.long_term_goal">
                                            <p class="insight-pill-body inactive">Not set — click to add.</p>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <div class="field-error" x-show="errorMsg" x-text="errorMsg"></div>
                        <template x-if="loading"><p>Loading…</p></template>

                        <template x-if="!loading && project">
                            <div>

                                <!-- Running now (all in-progress tasks, not just the first) -->
                                <!-- Insight Pill (Phase 5 close-out polish) -- replaces the old
                                     .running-card left-edge treatment. Same .ws-section outer
                                     shell every other workspace section uses. Fixed 2026-07-29:
                                     was a single pill bound to one runningTask -- a second
                                     in-progress task was invisible here even though it showed
                                     correctly in the Tasks list. Now one pill per running task,
                                     each visually separate (own card, own gap), with the same
                                     4-tier hierarchy the Tasks list below uses: status label,
                                     kind tag, task name, running note. -->
                                <div class="ws-section" x-show="runningTasks.length">
                                    <div class="running-now-list">
                                        <template x-for="rt in runningTasks" :key="rt.id">
                                            <div class="insight-pill">
                                                <div class="insight-pill-head">
                                                    <span class="insight-pill-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="6 3 20 12 6 21 6 3"/></svg></span>
                                                    <span class="insight-pill-label">Running now</span>
                                                    <span class="trv2-kind task running-now-tag" x-text="rt.kind === 'reminder' ? 'Reminder' : 'Task'"></span>
                                                </div>
                                                <p class="insight-pill-running-name" x-text="rt.name"></p>
                                                <p class="insight-pill-note" x-show="rt.running_note" x-text="rt.running_note"></p>
                                            </div>
                                        </template>
                                    </div>
                                </div>

                                <!-- Tasks section -- same trv2-row anatomy as Today.
                                     Delete button removed from rows (Round 2 build,
                                     item 9); persistent add-task row removed (item 10)
                                     -- adding a task opens the modal below via the
                                     "+ Add task" head-action. -->
                                <div class="ws-section">
                                    <div class="ws-section-head">
                                        <h2>Tasks</h2>
                                        <button class="head-action" x-show="project.status !== 'completed'" @click="openAddTaskModal()">+ Add task</button>
                                    </div>
                                    <div class="task-list" style="max-height: none; overflow: visible;">
                                        <template x-for="task in tasks" :key="task.id">
                                            <div>
                                                <div class="trv2-row" :class="{ 'is-done': task.status==='done' }" @click="project.status === 'completed' ? null : openEditTaskModal(task)" role="button" tabindex="0" @keydown.enter.prevent="project.status === 'completed' ? null : openEditTaskModal(task)" @keydown.space.prevent="project.status === 'completed' ? null : openEditTaskModal(task)" :aria-label="'Edit task: ' + task.name" style="grid-template-columns: auto minmax(0, 1fr) auto;">
                                                    <button class="trv2-check" :disabled="project.status === 'completed'" :class="{ 'is-pending': isPendingComplete(task), 'is-done': task.status==='done' }" @click.stop="(task.status==='done' || project.status === 'completed') ? null : handleCompleteClick(task)" :aria-label="task.status==='done' ? 'Already done' : (isPendingComplete(task) ? 'Confirm mark done' : 'Mark done')" :title="task.status==='done' ? 'Already done' : (isPendingComplete(task) ? 'Tap again to confirm' : 'Mark done')">
                                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                                                    </button>
                                                    <div class="trv2-body">
                                                        <div style="display: flex; align-items: center; gap: 6px;">
                                                            <div class="trv2-name" x-text="task.name"></div>
                                                            <template x-if="task.priority==='high'"><span class="priority-badge high"><span class="dot"></span>High</span></template>
                                                        </div>
                                                        <div class="trv2-meta">
                                                            <span class="trv2-kind task">Task</span>
                                                            <template x-if="task.status==='not_started' || task.status==='paused'">
                                                                <button class="trv2-start" @click.stop="startTask(task)" :title="task.status==='paused' ? 'Resume task' : 'Start task'" x-text="task.status==='paused' ? '▶ Resume' : '▶ Start'"></button>
                                                            </template>
                                                            <template x-if="isPendingComplete(task)">
                                                                <span class="trv2-confirm-hint">Tap ✓ again to confirm</span>
                                                            </template>
                                                        </div>
                                                        <template x-if="task.status === 'paused' && task.running_note">
                                                            <div class="trv2-pause-reason" x-text="task.running_note"></div>
                                                        </template>
                                                    </div>
                                                    <!-- Right side: date+time, plus a status tag for not-done tasks
                                                         (moved off the left meta line, which used to append
                                                         "· In progress"/"· Paused" there -- redundant with this
                                                         tag once both existed). Reuses the existing
                                                         .task-edit-status pill from the task edit modal, not a
                                                         new component. -->
                                                    <div class="trv2-time-col">
                                                        <div class="trv2-time" x-text="task.status==='done' && task.completed_at ? ('Done · ' + window.formatTime12h(task.completed_at.slice(11,16))) : window.formatTaskDateTime(task.scheduled_date, task.scheduled_time)"></div>
                                                        <template x-if="task.status !== 'done'">
                                                            <span class="task-edit-status" :class="{ 'in-progress': task.status === 'in_progress' }" x-text="task.status === 'in_progress' ? 'In progress' : (task.status === 'paused' ? 'Paused' : 'Not started')"></span>
                                                        </template>
                                                    </div>
                                                </div>
                                                <p class="task-note" x-show="task.status==='done' && task.completion_note" x-text="task.completion_note" style="padding: 4px 12px 8px 54px; color: var(--text-muted); font-size: 13px; font-style: italic;"></p>
                                            </div>
                                        </template>
                                        <template x-if="tasks.length === 0">
                                            <p style="color: var(--text-muted); font-style: italic; padding: var(--pad-md) 0;">No tasks yet. Click <strong>+ Add task</strong> above to create one.</p>
                                        </template>
                                    </div>
                                </div>

                                <!-- Work log section -->
                                <div class="ws-section">
                                    <div class="ws-section-head">
                                        <h2>Work log</h2>
                                        <span class="head-meta" x-text="logs.length + (logs.length === 1 ? ' entry' : ' entries')"></span>
                                    </div>
                                    <template x-if="project.status !== 'completed'">
                                        <div>
                                            <div class="field"><textarea x-model="newLogBody" rows="2" placeholder="Add a note about today's work"></textarea></div>
                                            <div class="modal-actions" style="justify-content: flex-start; margin-bottom: var(--pad-md);">
                                                <button class="btn btn-primary" @click="addLog()">Add entry</button>
                                            </div>
                                        </div>
                                    </template>

                                    <!-- Insight Pill (Phase 5 close-out polish) -- just the single
                                         most recent entry, always visible regardless of which date
                                         group is expanded below. Also still appears normally in its
                                         own day group -- same "highlight duplicates what's in the
                                         full list" pattern already used by Running Now + Tasks. -->
                                    <template x-if="mostRecentLog">
                                        <div class="insight-pill" style="margin-bottom: var(--pad-md);">
                                            <div class="insight-pill-head">
                                                <span class="insight-pill-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span>
                                                <span class="insight-pill-label">Latest update</span>
                                            </div>
                                            <p class="insight-pill-body" x-text="mostRecentLog.body"></p>
                                        </div>
                                    </template>

                                    <template x-for="group in logGroups" :key="group.date">
                                        <div class="worklog-day">
                                            <button class="worklog-day-head" @click="toggleDate(group.date)">
                                                <span x-text="group.date"></span>
                                                <span x-text="group.entries.length + ' · ' + (isDateExpanded(group.date) ? '−' : '+')"></span>
                                            </button>
                                            <template x-if="isDateExpanded(group.date)">
                                                <div>
                                                    <template x-for="log in group.entries" :key="log.id">
                                                        <div>
                                                            <template x-if="editingLogId !== log.id">
                                                                <div class="worklog-line">
                                                                    <span class="worklog-line-time" x-text="formatTime(log.created_at)"></span>
                                                                    <span :class="log.entry_type==='task_completion' ? 'worklog-line-body system' : 'worklog-line-body'" x-text="log.body"></span>
                                                                    <button class="worklog-line-edit" x-show="project.status !== 'completed'" @click="startEditLog(log)">Edit</button>
                                                                </div>
                                                            </template>
                                                            <template x-if="editingLogId === log.id">
                                                                <div style="padding: 10px 0; border-bottom: 1px solid var(--border);">
                                                                    <div class="field"><textarea x-model="editingLogBody" rows="2"></textarea></div>
                                                                    <div class="modal-actions">
                                                                        <button class="btn-text" @click="cancelEditLog()">Cancel</button>
                                                                        <button class="btn btn-primary" @click="saveEditLog(log)">Save</button>
                                                                    </div>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>

                            </div>
                        </template>

                        <!-- Workspace task modal (add + edit). Same shape as
                             Today's task modal (Round 2 build, item 13). Project
                             field is auto-locked here since the task always belongs
                             to this workspace's project. -->
                        <template x-if="taskModalOpen">
                            <div class="modal-overlay" @click.self="closeTaskModal()">
                                <div class="modal task-edit-modal">
                                    <div class="task-edit-hero">
                                        <div class="task-edit-hero-left">
                                            <div class="task-edit-eyebrow">
                                                <span x-text="editingTaskId ? 'Edit task' : 'New task'"></span>
                                                <template x-if="project"><span> · <span x-text="project.name"></span></span></template>
                                            </div>
                                            <input class="task-edit-name-input" type="text" x-model="taskForm.name" placeholder="What do you need to do?" autofocus>
                                        </div>
                                        <template x-if="editingTaskId">
                                            <span class="task-edit-status" :class="{ 'in-progress': (tasks.find(t => t.id === editingTaskId) || {}).status === 'in_progress', 'done': (tasks.find(t => t.id === editingTaskId) || {}).status === 'done' }" x-text="((tasks.find(t => t.id === editingTaskId) || {}).status === 'in_progress' ? 'In progress' : ((tasks.find(t => t.id === editingTaskId) || {}).status === 'done' ? 'Done' : 'Not started'))"></span>
                                        </template>
                                    </div>

                                    <div class="modal-section-lbl">Schedule</div>
                                    <div class="field-row">
                                        <div class="field"><label>Date</label><input type="date" x-model="taskForm.scheduled_date"></div>
                                        <div class="field"><label>Time</label>
                                            <div class="tp-numeric" x-data="timePicker12h" x-modelable="value" x-model="taskForm.scheduled_time">
                                                <select :value="hh" @change="updateHH($event.target.value)" aria-label="Hour"><option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option><option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option></select><span class="colon">:</span><select :value="mm" @change="updateMM($event.target.value)" aria-label="Minute"><option value="00">00</option><option value="15">15</option><option value="30">30</option><option value="45">45</option></select><div class="tp-ampm" role="group" aria-label="AM or PM"><button type="button" @click.prevent="updateAMPM('AM')" :aria-pressed="ampm === 'AM'">AM</button><button type="button" @click.prevent="updateAMPM('PM')" :aria-pressed="ampm === 'PM'">PM</button></div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="field-checkbox"><label><input type="checkbox" x-model="taskForm.notify_enabled"> Notify me at this time</label></div>
                                    <div class="priority-toggle-row">
                                        <span class="priority-toggle-lbl">Priority</span>
                                        <div class="priority-toggle" role="group" aria-label="Priority">
                                            <button type="button" :class="{active: taskForm.priority!=='high'}" @click="taskForm.priority='normal'">Normal</button>
                                            <button type="button" :class="{active: taskForm.priority==='high'}" @click="taskForm.priority='high'">High</button>
                                        </div>
                                    </div>

                                    <div class="task-edit-actions">
                                        <template x-if="editingTaskId">
                                            <div style="display: flex; gap: 16px;">
                                                <button class="task-edit-delete" @click="deleteFromEditModal()">Delete task</button>
                                                <button class="btn-text" style="color: var(--text-secondary);" x-show="(tasks.find(t => t.id === editingTaskId) || {}).status === 'in_progress'" @click="pauseTask()">Pause task</button>
                                            </div>
                                        </template>
                                        <template x-if="!editingTaskId"><span></span></template>
                                        <div class="task-edit-actions-right">
                                            <button class="btn-text" @click="closeTaskModal()">Cancel</button>
                                            <button class="btn btn-primary" @click="submitTaskModal()" x-text="editingTaskId ? 'Save' : 'Add'"></button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- Goal edit modal. Opened from clicking either goal
                             block in the hero, or the ⋯ menu's "Edit goals". -->
                        <template x-if="editingHeader">
                            <div class="modal-overlay" @click.self="editingHeader = false">
                                <div class="modal" style="max-width: 520px;">
                                    <h2 style="font-family: var(--font-sans); font-size: 17px; margin: 0 0 4px;">Edit goals</h2>
                                    <p style="color: var(--text-muted); font-size: 12.5px; margin: 0 0 20px;">Short-term is what you're pushing for now. Long-term is the destination.</p>
                                    <div class="modal-section-lbl" style="color: var(--accent-sage);">Short-term goal</div>
                                    <div class="field">
                                        <label>Goal</label>
                                        <textarea x-model="headerForm.short_term_goal" rows="2" placeholder="What are you shipping first?"></textarea>
                                    </div>
                                    <div class="field">
                                        <label>Target date</label>
                                        <input type="date" x-model="headerForm.short_term_goal_date">
                                    </div>
                                    <div class="modal-section">
                                        <div class="modal-section-lbl" style="color: var(--accent-blue);">Long-term goal</div>
                                        <div class="field">
                                            <label>Goal</label>
                                            <textarea x-model="headerForm.long_term_goal" rows="2" placeholder="Where does this project end up?"></textarea>
                                        </div>
                                        <div class="field">
                                            <label>Target date</label>
                                            <input type="date" x-model="headerForm.long_term_goal_date">
                                        </div>
                                    </div>
                                    <div class="modal-actions">
                                        <button class="btn-text" @click="editingHeader = false">Cancel</button>
                                        <button class="btn btn-primary" @click="saveHeader()">Save</button>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- Calendar tab -->
                <template x-if="tab==='calendar'">
                    <div x-data="calendarPage({ onOpenProject: (id) => { tab = 'projects'; openProject(id); }, onGoToday: () => setTab('today'), onOpenNotebook: () => { overlay = 'notebook'; } })">
                        <div class="section-header">
                            <h1>Calendar</h1>
                        </div>

                        <div class="card calendar-page">
                            <!-- Controls row (2026-07-29, live-testing bug): the always-open
                                 7-chip category row plus a separate range row read as
                                 cluttered/two full bands. Now one row: category filters
                                 collapsed into a dropdown menu -- all on by default, toggle
                                 whichever you want off. Grid-only; Day Detail always shows
                                 the full truth regardless of these filters.
                                 The "AI range" preset row that used to sit here was removed
                                 2026-07-31 -- confirmed genuinely decorative in effect (it set
                                 a local rangePreset value nothing else in the app ever read;
                                 already flagged as "a UI hint only, not wired to a live query"
                                 in this repo's own docs before Abhishek asked about it directly
                                 after finding clicking it did nothing to the grid). -->
                            <div class="cal-controls-row">
                                <div class="cal-filter-dropdown" @click.outside="filterMenuOpen = false">
                                    <button type="button" class="cal-filter-toggle" @click="filterMenuOpen = !filterMenuOpen" :aria-expanded="filterMenuOpen">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x-html="iconSvg('filter')"></svg>
                                        <span x-text="'Filters · ' + activeCategoryCount + '/' + categoryDefs.length"></span>
                                        <svg class="cal-filter-chevron" :class="{open: filterMenuOpen}" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x-html="iconSvg('chevron')"></svg>
                                    </button>
                                    <div class="cal-filter-menu" x-show="filterMenuOpen" x-cloak>
                                        <div class="cal-filter-menu-actions">
                                            <button type="button" class="btn-text" @click="selectAllCategories()">All</button>
                                            <button type="button" class="btn-text" @click="selectNoCategories()">None</button>
                                        </div>
                                        <template x-for="c in categoryDefs" :key="c.key">
                                            <label class="cal-filter-item">
                                                <input type="checkbox" :checked="categories[c.key]" @change="toggleCategory(c.key)">
                                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x-html="iconSvg(c.icon)"></svg>
                                                <span x-text="c.label"></span>
                                            </label>
                                        </template>
                                    </div>
                                </div>
                            </div>

                            <div class="cal-head">
                                <div class="cal-title-group">
                                    <span class="cal-title" x-text="monthLabel"></span>
                                    <select class="cal-year-select" x-model.number="viewYear" @change="loadMonth()">
                                        <template x-for="y in yearOptions" :key="y">
                                            <option :value="y" :selected="y === viewYear" x-text="y"></option>
                                        </template>
                                    </select>
                                </div>
                                <div class="cal-nav">
                                    <button type="button" @click="prevMonth()" aria-label="Previous month">‹</button>
                                    <button type="button" class="cal-today-btn" @click="goToToday()">Today</button>
                                    <button type="button" @click="nextMonth()" aria-label="Next month">›</button>
                                </div>
                            </div>

                            <div class="field-error" x-show="errorMsg" x-text="errorMsg"></div>
                            <template x-if="loading">
                                <p class="nodata">Loading…</p>
                            </template>

                            <template x-if="!loading">
                                <div>
                                    <div class="cal-weekdays">
                                        <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
                                    </div>
                                    <div class="cal-grid">
                                        <template x-for="cell in days" :key="cell.date">
                                            <div class="cal-cell" :class="{out: !cell.inMonth, today: cell.isToday, selected: cell.isSelected}" @click="selectDate(cell.date)">
                                                <div class="cal-cell-num-row">
                                                    <span class="cal-cell-num" x-text="cell.day"></span>
                                                    <span class="cal-today-label" x-show="cell.isToday">Today</span>
                                                </div>
                                                <div class="cal-cell-blocks">
                                                    <template x-for="b in cell.blocks" :key="b.color">
                                                        <div class="cal-block" :class="b.color">
                                                            <div class="cal-badge" :class="b.color">
                                                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" x-html="iconSvg(b.icon)"></svg>
                                                            </div>
                                                            <div class="cal-block-text">
                                                                <span class="cal-t1" x-text="b.t1"></span>
                                                                <span class="cal-t2" x-show="b.t2" x-text="b.t2"></span>
                                                            </div>
                                                            <span class="cal-flag" x-show="b.overdueFlag" x-text="'● ' + b.overdueFlag + ' late'"></span>
                                                        </div>
                                                    </template>
                                                    <div class="cal-journal-line" x-show="cell.journal">
                                                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x-html="iconSvg('pencil')"></svg>
                                                        <span>Journal</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </template>
                                    </div>

                                    <!-- ==================== Day Detail: full-width, below the
                                         grid, updates in place -- never a modal or right-side
                                         drawer (Atlas already has a right-side AI panel).
                                         Rebuilt 2026-07-31 (Phase 2, "Editorial Ledger" -- mockup
                                         Option A, approved) -- big serif date + a bold KPI strip so
                                         the day's shape reads before any row does, section titles in
                                         serif italic with a solid top-edge in that section's real
                                         locked accent (was one flat blue icon on every section
                                         regardless of meaning), and the whole block finally has real
                                         card depth like every other card in Atlas -- it previously had
                                         none, just a thin top border floating on the page background. ==================== -->
                                    <div class="dd-ledger" x-show="selectedDate">
                                        <div class="dd-ledger-head">
                                            <div class="dd-ledger-num" x-text="new Date(selectedDate + 'T00:00:00').getDate()"></div>
                                            <div class="dd-ledger-headtext">
                                                <div class="dd-ledger-day" x-text="new Date(selectedDate + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long' })"></div>
                                                <div class="dd-ledger-month">
                                                    <span x-text="new Date(selectedDate + 'T00:00:00').toLocaleDateString('en-US', { month: 'long', year: 'numeric' })"></span>
                                                    <span class="dd-status-chip" x-text="selectedIsFuture ? 'Planned' : (selectedIsToday ? 'Today' : 'Logged')"></span>
                                                </div>
                                            </div>
                                        </div>

                                        <template x-if="!selectedHasAnything">
                                            <p class="dd-empty" x-text="selectedIsFuture ? 'Nothing planned yet for this day.' : 'Nothing logged for this day.'"></p>
                                        </template>

                                        <template x-if="selectedHasAnything">
                                            <div>
                                                <div class="dd-kpis">
                                                    <div class="dd-kpi-pill" x-show="selectedChecklist.length > 0 && !selectedIsFuture">
                                                        <span class="dd-kpi-num sage" x-text="selectedChecklistGroups.done.length + '/' + selectedChecklist.length"></span>
                                                        <span class="dd-kpi-label">Checklist</span>
                                                    </div>
                                                    <div class="dd-kpi-pill" x-show="selectedTasks.length > 0">
                                                        <span class="dd-kpi-num blue" x-text="selectedTasks.length"></span>
                                                        <span class="dd-kpi-label" x-text="selectedTasks.length === 1 ? 'Task' : 'Tasks'"></span>
                                                    </div>
                                                    <div class="dd-kpi-pill" x-show="selectedProjectWork.length > 0">
                                                        <span class="dd-kpi-num lilac" x-text="selectedProjectWork.length"></span>
                                                        <span class="dd-kpi-label" x-text="selectedProjectWork.length === 1 ? 'Work log' : 'Work logs'"></span>
                                                    </div>
                                                </div>

                                                <div class="dd-body">
                                                    <template x-if="selectedSleep || selectedWorkout">
                                                        <div class="dd-card c-sage">
                                                            <div class="dd-card-title">Health</div>
                                                            <div class="dd-health-grid">
                                                                <template x-if="selectedSleep">
                                                                    <div class="dd-health-col">
                                                                        <div class="dd-row" style="border:none; padding-bottom:0;">
                                                                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x-html="iconSvg('sleep')"></svg>
                                                                            <span class="name">Sleep</span>
                                                                            <span class="dd-chip done" x-show="selectedSleep.sleep_score != null" x-text="'Score ' + selectedSleep.sleep_score"></span>
                                                                        </div>
                                                                        <div class="dd-fact-inline">
                                                                            <span x-show="selectedSleep.duration_minutes != null" x-text="Math.floor(selectedSleep.duration_minutes/60) + 'h ' + (selectedSleep.duration_minutes%60) + 'm'"></span>
                                                                            <span x-show="selectedSleep.deep_minutes != null" x-text="'Deep ' + selectedSleep.deep_minutes + 'm'"></span>
                                                                            <span x-show="selectedSleep.rem_minutes != null" x-text="'REM ' + selectedSleep.rem_minutes + 'm'"></span>
                                                                            <span x-show="selectedSleep.resting_hr != null" x-text="'RHR ' + selectedSleep.resting_hr + ' bpm'"></span>
                                                                            <span x-show="selectedSleep.hrv != null" x-text="'HRV ' + selectedSleep.hrv + ' ms'"></span>
                                                                        </div>
                                                                        <div class="dd-note" x-show="selectedSleep.note" x-text="selectedSleep.note"></div>
                                                                    </div>
                                                                </template>
                                                                <template x-if="selectedWorkout">
                                                                    <div class="dd-health-col">
                                                                        <div class="dd-row" style="border:none; padding-bottom:0;">
                                                                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x-html="iconSvg('workout')"></svg>
                                                                            <span class="name" x-text="(selectedWorkout.workout_type || dayTypeLabel(selectedWorkout.day_type) || 'Workout') + (selectedWorkoutSessions.length ? ' · ' + selectedWorkoutSessions.length + ' session' + (selectedWorkoutSessions.length===1?'':'s') : '')"></span>
                                                                            <span class="dd-chip done" x-show="selectedWorkout.workout_score != null" x-text="'Score ' + selectedWorkout.workout_score"></span>
                                                                        </div>
                                                                        <div class="dd-fact-inline">
                                                                            <span x-show="selectedWorkout.calories != null" x-text="selectedWorkout.calories + ' kcal'"></span>
                                                                            <span x-show="selectedWorkout.vo2_max != null" x-text="'VO2 ' + selectedWorkout.vo2_max"></span>
                                                                        </div>
                                                                        <div class="dd-note" x-show="selectedWorkout.note" x-text="selectedWorkout.note"></div>
                                                                    </div>
                                                                </template>
                                                            </div>
                                                        </div>
                                                    </template>

                                                    <!-- Future days show the same real per-item list as past/today
                                                         (2026-08-06, direct feedback: grouped project counts hid the
                                                         actual task names -- "I don't see this task... it's not
                                                         showing the task name"). Only the trailing chip differs: a
                                                         status chip means nothing before the day has happened, so
                                                         future rows show which project it's in (or Standalone)
                                                         instead, matching the same info the Upcoming modal shows. -->
                                                    <template x-if="selectedTasks.length > 0">
                                                        <div class="dd-card c-blue" x-data="{ showAllTasks: false }">
                                                            <div class="dd-card-title">Tasks &amp; Reminders</div>
                                                            <template x-for="t in (showAllTasks ? selectedTasks : selectedTasks.slice(0, 5))" :key="t.id">
                                                                <div class="dd-row clickable" @click="openTaskDrillDown(t)">
                                                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x-html="iconSvg(t.kind === 'reminder' ? 'bell' : 'list')"></svg>
                                                                    <span class="name" x-text="t.name"></span>
                                                                    <template x-if="t.priority==='high'"><span class="priority-badge high"><span class="dot"></span>High</span></template>
                                                                    <span class="time" x-show="t.scheduled_time" x-text="window.formatTime12h ? window.formatTime12h(t.scheduled_time) : t.scheduled_time"></span>
                                                                    <template x-if="t.project_id">
                                                                        <span class="id-chip" :class="'color-' + projectColorKey(t.project_id)" x-text="projectInitial(t.project_id)"></span>
                                                                    </template>
                                                                    <template x-if="!selectedIsFuture">
                                                                        <span class="dd-chip" :class="{done: taskStatus(t)==='done', overdue: taskStatus(t)==='overdue'}" x-text="taskStatus(t) === 'done' ? 'Done' : (taskStatus(t) === 'overdue' ? 'Overdue' : 'Upcoming')"></span>
                                                                    </template>
                                                                    <template x-if="selectedIsFuture">
                                                                        <span class="dd-chip" x-text="t.project_id ? projectName(t.project_id) : 'Standalone'"></span>
                                                                    </template>
                                                                    <svg class="dd-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x-html="iconSvg('chevron')"></svg>
                                                                </div>
                                                            </template>
                                                            <button type="button" class="btn-text" style="margin-top:8px; font-size:12px; padding:0;" x-show="selectedTasks.length > 5 && !showAllTasks" @click="showAllTasks = true" x-text="'+ ' + (selectedTasks.length - 5) + ' more'"></button>
                                                        </div>
                                                    </template>

                                                    <template x-if="selectedChecklist.length > 0 && !selectedIsFuture">
                                                        <div class="dd-card c-sage">
                                                            <div class="dd-card-title">Checklist</div>
                                                            <div class="dd-cl-row done" x-show="selectedChecklistGroups.done.length">
                                                                <span class="dd-cl-dot"></span><span class="dd-cl-label">Done</span><span class="dd-cl-names" x-text="selectedChecklistGroups.done.join(', ')"></span>
                                                            </div>
                                                            <div class="dd-cl-row skipped" x-show="selectedChecklistGroups.skipped.length">
                                                                <span class="dd-cl-dot"></span><span class="dd-cl-label">Skipped</span><span class="dd-cl-names" x-text="selectedChecklistGroups.skipped.join(', ')"></span>
                                                            </div>
                                                            <div class="dd-cl-row holiday" x-show="selectedChecklistGroups.holiday.length">
                                                                <span class="dd-cl-dot"></span><span class="dd-cl-label">Holiday</span><span class="dd-cl-names" x-text="selectedChecklistGroups.holiday.join(', ')"></span>
                                                            </div>
                                                            <div class="dd-cl-row missed" x-show="selectedChecklistGroups.missed.length">
                                                                <span class="dd-cl-dot"></span><span class="dd-cl-label">Missed</span><span class="dd-cl-names" x-text="selectedChecklistGroups.missed.join(', ')"></span>
                                                            </div>
                                                            <button type="button" class="dd-see-full" @click="openChecklistDrillDown()">See full routine →</button>
                                                        </div>
                                                    </template>

                                                    <template x-if="selectedProjectWork.length > 0">
                                                        <div class="dd-card c-lilac">
                                                            <div class="dd-card-title">Projects &amp; Work Logs</div>
                                                            <template x-for="p in selectedProjectWork" :key="p.id">
                                                                <div class="dd-row clickable" @click="openProjectWorkDrillDown(p)">
                                                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x-html="iconSvg('note')"></svg>
                                                                    <span class="name" x-text="p.body"></span>
                                                                    <span class="dd-chip" x-text="projectName(p.project_id)"></span>
                                                                    <svg class="dd-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x-html="iconSvg('chevron')"></svg>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </template>

                                                    <!-- Journal deliberately hidden for now per design plan. Fetch remains in calendar.js, just not rendered. -->
                                                </div>
                                            </div>
                                        </template>
                                    </div>

                                    <!-- Dated Checklist drill-down (2026-07-31, Phase 2). Read-only
                                         full block breakdown for the selected date -- same visual
                                         language (.cl-block/.ck-row/.ck-status) Today's own Routine
                                         uses, no Log button, no editing, no new fetch (derives from
                                         the month data already loaded). Opened from the Checklist
                                         section's "See full routine" link above. -->
                                    <template x-if="checklistDrillOpen">
                                        <div class="modal-overlay" @click.self="closeChecklistDrillDown()">
                                            <div class="modal" style="max-width: 520px;">
                                                <div class="section-header" style="margin-top: 0;">
                                                    <h2 style="margin:0;" x-text="selectedDateLabel"></h2>
                                                    <button class="btn-text" @click="closeChecklistDrillDown()">Close</button>
                                                </div>
                                                <div class="stack">
                                                    <template x-for="group in selectedChecklistByBlock" :key="group.block.key">
                                                        <div class="cl-block" :class="'color-' + group.block.colorKey">
                                                            <div class="cl-block-header" style="cursor: default;">
                                                                <span class="cl-block-icon" x-text="group.block.icon"></span>
                                                                <span class="cl-block-title" x-text="group.block.label"></span>
                                                            </div>
                                                            <div class="cl-block-body">
                                                                <template x-for="c in group.items" :key="c.item.id">
                                                                    <div class="ck-row" :class="c.history && c.history.status==='done' ? 'is-done' : (c.history && c.history.status==='skipped' ? 'is-skipped' : '')">
                                                                        <div class="ck-row-main">
                                                                            <div class="ck-icon" x-text="c.item.icon || '📋'"></div>
                                                                            <div class="ck-info"><div class="ck-title" x-text="c.item.name"></div></div>
                                                                            <div class="ck-row-actions">
                                                                                <span class="ck-status" :class="'ck-status-' + (c.history ? c.history.status : 'pending')" x-text="checklistStatusLabel(c)"></span>
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                </template>
                                                            </div>
                                                        </div>
                                                    </template>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

            </main>

            <!-- Undo toast host -->
            <div class="toast-container" x-data="undoToastHost()">
                <template x-for="toast in toasts" :key="toast.id">
                    <div class="toast">
                        <span x-text="toast.message"></span>
                        <button @click="undo(toast)">Undo</button>
                    </div>
                </template>
            </div>

            <!-- Confirm dialog host: replaces browser confirm() everywhere -->
            <div x-data="confirmDialogHost()">
                <template x-if="dialog">
                    <div class="modal-overlay" style="z-index: 200;" @click.self="respond(false)">
                        <div class="modal">
                            <h2>Are you sure?</h2>
                            <p class="project-focus" x-text="dialog.message"></p>
                            <div class="modal-actions">
                                <button class="btn-text" x-show="dialog.cancelLabel" @click="respond(false)" x-text="dialog.cancelLabel"></button>
                                <button class="btn" :class="dialog.isDanger ? 'btn-danger' : 'btn-primary'" @click="respond(true)" x-text="dialog.confirmLabel"></button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Note prompt host: replaces browser prompt() everywhere -->
            <div x-data="notePromptHost()">
                <template x-if="dialog">
                    <div class="modal-overlay" style="z-index: 200;" @click.self="cancel()">
                        <div class="modal">
                            <h2 x-text="dialog.message"></h2>
                            <div class="field">
                                <textarea x-model="dialog.value" rows="3" :placeholder="dialog.placeholder" @keydown.ctrl.enter="submit()"></textarea>
                            </div>
                            <div class="modal-actions">
                                <button class="btn-text" @click="cancel()">Cancel</button>
                                <button class="btn-text" @click="skip()" x-text="dialog.skipLabel"></button>
                                <button class="btn btn-primary" @click="submit()" x-text="dialog.submitLabel"></button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </template>

</body>
</html>
