<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atlas</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#131316">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/icon-192.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Styles -->
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">

    <!-- Pre-load theme before Alpine -->
    <script type="module">
        import { initTheme } from './js/theme.js';
        initTheme();
    </script>

    <!-- App Entry (loads and starts Alpine itself, after components are registered) -->
    <script type="module" src="js/main.js"></script>
</head>
<body x-data="app()" x-init="init()">

    <!-- Loading placeholder while the session check runs -->
    <template x-if="!authReady">
        <div class="empty-state"><p>Loading Atlas…</p></div>
    </template>

    <!-- Sign-in screen -->
    <template x-if="authReady && !session">
        <div class="login-screen">
            <div class="card login-card" x-data="loginForm()">
                <span class="wordmark">Atlas</span>
                <form @submit.prevent="submit()">
                    <div class="field">
                        <label for="login-email">Email</label>
                        <input id="login-email" type="email" x-model="email" required autocomplete="username">
                    </div>
                    <div class="field">
                        <label for="login-password">Password</label>
                        <input id="login-password" type="password" x-model="password" required autocomplete="current-password">
                    </div>
                    <div class="field-error" x-show="error" x-text="error"></div>
                    <button type="submit" class="btn btn-primary" style="width:100%" :disabled="loading">
                        <span x-text="loading ? 'Signing in…' : 'Sign in'"></span>
                    </button>
                </form>
            </div>
        </div>
    </template>

    <!-- Main app shell -->
    <template x-if="authReady && session">
        <div>
            <div class="app-header-sticky">
                <header class="top-header">
                    <div class="logo">
                        <!-- Compass polygon filled (2026-07-26 polish) so the mark has
                             real presence at 24px, not a wire silhouette next to the
                             weightier wordmark. Circle stays a stroke -- filling both
                             would over-boldify the icon. -->
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" fill="currentColor" stroke="none"></polygon>
                        </svg>
                        <span class="wordmark">Atlas</span>
                    </div>

                    <div class="header-actions">
                        <button class="icon-button icon-button-accent" :class="{active: overlay==='notebook'}" @click="toggleOverlay('notebook')" title="Notebook">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                            </svg>
                        </button>
                        <button class="icon-button icon-button-accent" :class="{active: overlay==='restore'}" @click="toggleOverlay('restore')" title="Restore">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 12a9 9 0 1 0 3-6.7"></path>
                                <polyline points="3 4 3 9 8 9"></polyline>
                            </svg>
                        </button>
                        <span class="user-name">Abhishek</span>
                        <button class="theme-switcher-btn"
                                x-data="themeSwitcher"
                                @click="cycle()"
                                x-html="icon"
                                :title="`Current theme: ${current}`">
                        </button>
                        <button class="icon-button" @click="doSignOut()" title="Sign out">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                <polyline points="16 17 21 12 16 7"></polyline>
                                <line x1="21" y1="12" x2="9" y2="12"></line>
                            </svg>
                        </button>
                    </div>
                </header>

                <nav class="top-tabs">
                    <button class="tab" :class="{active: tab==='today'}" @click="setTab('today')">Today</button>
                    <button class="tab" :class="{active: tab==='projects'}" @click="setTab('projects')">Projects</button>
                    <button class="tab" :class="{active: tab==='calendar'}" @click="setTab('calendar')">Calendar</button>
                </nav>
            </div>

            <!-- ==================== ATLAS AI ==================== -->
            <div x-data="atlasAi()" x-init="init()" @keydown.window="handleGlobalKey($event)">
                <!-- Floating launcher: visible only when the panel is closed. Uses
                     Atlas's own compass mark (same icon as the header logo), not an
                     invented AI icon. -->
                <button class="ai-launcher" :class="{ 'ai-launcher-hidden': panelOpen }" @click="openPanel()" title="Open Atlas AI">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" fill="currentColor" stroke="none"></polygon>
                    </svg>
                </button>

                <!-- Docked panel: content-shifting, not an overlay. Flush against
                     the sticky header (top: 0 relative to the fixed offset applied
                     via CSS, spans to viewport bottom). -->
                <aside class="ai-panel" :class="{ 'ai-panel-open': panelOpen }">
                    <div class="ai-panel-header">
                        <div class="ai-panel-title-wrap">
                            <div class="ai-orb">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" fill="currentColor" stroke="none"></polygon>
                                </svg>
                            </div>
                            <span class="ai-panel-title">Atlas</span>
                        </div>
                        <div class="ai-header-icons">
                            <div class="model-pill-wrap" @click.outside="modelMenuOpen = false">
                                <button class="model-pill" @click.stop="modelMenuOpen = !modelMenuOpen" x-text="provider === 'vertex' ? 'Cloud (Gemini) ▾' : (model || 'Local') + ' ▾'"></button>
                                <div class="model-menu" :class="{ 'model-menu-open': modelMenuOpen }">
                                    <button :class="{ sel: provider === 'ollama' }" @click="setProvider('ollama')">🖥 Local</button>
                                    <template x-if="provider === 'ollama'">
                                        <div class="model-menu-field">
                                            <label>Model name</label>
                                            <input type="text" x-model="model" @change="saveProviderConfig()" @click.stop placeholder="e.g. gemma4, qwen3.6">
                                        </div>
                                    </template>
                                    <button :class="{ sel: provider === 'vertex' }" @click="setProvider('vertex')">☁ Cloud (Gemini)</button>
                                    <template x-if="provider === 'vertex'">
                                        <label class="model-menu-checkbox">
                                            <input type="checkbox" x-model="webSearch" @change="saveProviderConfig()">
                                            <span>🔍 Use web search</span>
                                        </label>
                                    </template>
                                    <label class="model-menu-checkbox">
                                        <input type="checkbox" x-model="voiceReply" @change="onVoiceReplyChange()">
                                        <span>🔊 Voice replies</span>
                                    </label>
                                </div>
                            </div>
                            <button class="hicon" @click="view = (view === 'notebook' ? 'chat' : 'notebook')" title="Memory Notebook">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                            </button>
                            <button class="hicon" @click="view = (view === 'settings' ? 'chat' : 'settings')" title="AI settings">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                            </button>
                            <button class="hicon" @click="askClearChat()" title="Clear chat">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
                            </button>
                            <button class="hicon" @click="closePanel()" title="Close">✕</button>
                        </div>
                    </div>

                    <!-- CHAT VIEW -->
                    <template x-if="view === 'chat'">
                        <div class="ai-chat-body">
                            <div class="ai-quick-actions">
                                <button class="qa-chip" @click="askQuickAction('explain_day')">Explain my day</button>
                                <button class="qa-chip" @click="askQuickAction('explain_task')">Break down a task</button>
                                <button class="qa-chip" @click="askQuickAction('explain_health')">Health check-in</button>
                            </div>
                            <div class="ai-messages" x-ref="messagesEl">
                                <template x-if="messages.length === 0">
                                    <div class="ai-empty-state">
                                        <div class="h">Ask Atlas anything about today</div>
                                        <div class="p">It reasons across your tasks, health, and routine — never just recites the dashboard.</div>
                                    </div>
                                </template>
                                <template x-for="(group, gi) in messageGroups" :key="gi">
                                    <div>
                                        <div class="day-sep" x-text="group.label"></div>
                                        <template x-for="m in group.items" :key="m.id">
                                            <div class="msg-row" :class="m.role">
                                                <template x-if="m.type === 'confirm'">
                                                    <div class="confirm-card">
                                                        <div class="confirm-card-head">
                                                            <div class="confirm-card-icon" x-html="m.draft.icon"></div>
                                                            <span class="confirm-card-title" x-text="m.draft.title"></span>
                                                        </div>
                                                        <div class="confirm-fields">
                                                            <template x-for="f in m.draft.fields" :key="f.k">
                                                                <div class="confirm-field"><span class="k" x-text="f.k"></span><span class="v" x-text="f.v"></span></div>
                                                            </template>
                                                        </div>
                                                        <template x-if="!m.decided">
                                                            <div class="confirm-actions">
                                                                <button class="confirm-btn cancel" @click="cancelDraft(m)">Cancel</button>
                                                                <button class="confirm-btn confirm" @click="confirmDraft(m)">Confirm &amp; save</button>
                                                            </div>
                                                        </template>
                                                        <template x-if="m.decided === 'saved'">
                                                            <div class="written-toast">✓ Saved</div>
                                                        </template>
                                                        <template x-if="m.decided === 'cancelled'">
                                                            <div class="discarded-note">Discarded — nothing was saved.</div>
                                                        </template>
                                                    </div>
                                                </template>
                                                <template x-if="m.type !== 'confirm'">
                                                    <div>
                                                        <div class="msg-bubble" :class="m.role" x-text="m.text"></div>
                                                        <div class="msg-meta-row">
                                                            <span class="msg-time" x-text="m.time"></span>
                                                            <template x-if="m.role === 'assistant' && m.providerLabel">
                                                                <span class="msg-provider-tag" x-text="m.providerLabel"></span>
                                                            </template>
                                                        </div>
                                                        <template x-if="m.role === 'assistant'">
                                                            <div class="msg-actions">
                                                                <button class="msg-action-btn" @click="toggleAudio(m)">
                                                                    <template x-if="m.voiceState === 'playing'"><span>⏹ Stop</span></template>
                                                                    <template x-if="m.voiceState === 'loading'"><span class="voice-spinner"></span></template>
                                                                    <template x-if="!m.voiceState || m.voiceState === 'idle'"><span>▶ Play</span></template>
                                                                </button>
                                                                <template x-if="!m.pinned">
                                                                    <button class="msg-action-btn" @click="pinMessage(m)">📌 Pin</button>
                                                                </template>
                                                                <template x-if="m.pinned">
                                                                    <span class="msg-action-btn pinned">📌 Pinned</span>
                                                                </template>
                                                                <template x-if="m.voiceTruncated">
                                                                    <span style="font-size:11px;color:var(--text-muted);margin-left:4px;">✂ Voice plays only part of this very long reply.</span>
                                                                </template>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                                <template x-if="thinking">
                                    <div class="thinking-dots"><span></span><span></span><span></span></div>
                                </template>
                            </div>
                            <div class="ai-composer">
                                <div class="composer-wrap">
                                    <textarea x-ref="composerEl" x-model="draft" rows="1" placeholder="Ask Atlas… (Enter to send, Shift+Enter for a new line)" @keydown.enter="handleComposerEnter($event)" @input="autoGrowComposer()"></textarea>
                                    <div class="composer-icons">
                                        <button class="mic-btn" :class="{ 'mic-listening': listening }" @click="toggleVoice()" :title="listening ? 'Stop listening' : 'Voice input'">
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
                                        </button>
                                        <button class="send-btn" @click="sendMessage()">
                                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                                        </button>
                                    </div>
                                </div>
                                <div class="field-error" x-show="errorMsg" x-text="errorMsg" style="margin: 6px 0 0; font-size: 11.5px;"></div>
                                <div class="composer-hint">Voice input only, text replies · Alt+M toggles the mic</div>
                            </div>
                        </div>
                    </template>

                    <!-- NOTEBOOK VIEW -->
                    <template x-if="view === 'notebook'">
                        <div class="nb-view">
                            <div class="nb-toolbar">
                                <button class="nb-back" @click="view = 'chat'">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                                </button>
                                <span class="nb-toolbar-title">Memory Notebook</span>
                                <div class="nb-toolbar-actions">
                                    <button class="nb-tbtn" @click="saveSession()">Save Session</button>
                                    <button class="nb-tbtn" @click="compactNotebook()">Compact</button>
                                </div>
                            </div>
                            <div class="nb-list">
                                <template x-if="notebookEntries.length === 0">
                                    <div class="ai-empty-state"><div class="h">No memory yet</div><div class="p">Pin a response, or save a session, to start building Atlas's memory.</div></div>
                                </template>
                                <template x-for="(e, i) in notebookEntries" :key="i">
                                    <div class="nb-entry">
                                        <div class="nb-entry-head">
                                            <span class="nb-badge" :class="e.type" x-text="e.type"></span>
                                            <span class="nb-entry-date" x-text="e.date"></span>
                                        </div>
                                        <div class="nb-entry-text" x-text="e.text"></div>
                                        <button class="nb-entry-del" @click="deleteNotebookEntry(i)">Delete</button>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- SETTINGS VIEW (provider config + link to Persona/PIN) -->
                    <template x-if="view === 'settings'">
                        <div class="settings-view">
                            <div class="nb-toolbar">
                                <button class="nb-back" @click="view = 'chat'">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                                </button>
                                <span class="nb-toolbar-title">Atlas AI settings</span>
                            </div>
                            <div class="settings-body">
                                <div>
                                    <div class="settings-block-label" style="margin-bottom:8px;">Provider</div>
                                    <div class="provider-choice">
                                        <div class="prov-btn" :class="{ sel: provider === 'ollama' }" @click="setProvider('ollama')">🖥 Local (Ollama)
                                            <div style="font-size:10.5px;margin-top:3px;color:var(--text-muted);" x-text="model"></div>
                                        </div>
                                        <div class="prov-btn" :class="{ sel: provider === 'vertex' }" @click="setProvider('vertex')">☁ Cloud (Vertex)</div>
                                    </div>
                                </div>
                                <div class="pfield">
                                    <label>Local model name</label>
                                    <input type="text" x-model="model" @change="saveProviderConfig()" placeholder="e.g. gemma4, qwen3.6">
                                </div>
                                <div class="pfield">
                                    <label>Local endpoint</label>
                                    <input type="text" x-model="endpoint" @change="saveProviderConfig()" placeholder="http://localhost:11434">
                                </div>
                                <template x-if="provider === 'vertex'">
                                    <label class="model-menu-checkbox" style="background:var(--surface-2); border-radius:8px;">
                                        <input type="checkbox" x-model="webSearch" @change="saveProviderConfig()">
                                        <span>🔍 Use web search (live results via Gemini)</span>
                                    </label>
                                </template>
                                <label class="model-menu-checkbox" style="background:var(--surface-2); border-radius:8px;">
                                    <input type="checkbox" x-model="voiceReply" @change="onVoiceReplyChange()">
                                    <span>🔊 Voice replies (Atlas speaks its answers aloud)</span>
                                </label>
                                <template x-if="voiceReply && voiceList.length">
                                    <div class="pfield">
                                        <label>Voice</label>
                                        <select x-model="voiceName" @change="onVoiceNameChange()" style="width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface-1);color:var(--text);font-size:13px;">
                                            <option value="">Default voice</option>
                                            <template x-for="v in voiceList" :key="v.name">
                                                <option :value="v.name" x-text="(v.label || v.name) + ' (' + v.lang + ')'"></option>
                                            </template>
                                        </select>
                                        <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">On Windows, look for Microsoft voices — they sound the most natural.</div>
                                    </div>
                                </template>
                                <div class="settings-row-link" @click="view = 'persona'">
                                    <span>🔒 Persona &amp; PIN</span><span>→</span>
                                </div>
                                <div class="settings-block-label" style="margin-top:24px; margin-bottom:8px;">Push Notifications (Atlas)</div>
                                <div class="settings-row-link" style="justify-content:space-between;" id="btn-push-toggle" @click="window.PushClient.toggle()">
                                    <span>Enable Push Notifications</span>
                                    <span id="push-status-text" style="color:var(--text-muted); font-size:12px;">Checking...</span>
                                </div>
                                <div class="settings-row-link" style="justify-content:center; color:var(--primary);" id="btn-push-test" style="display:none;" @click="window.PushClient.test()">
                                    Test Notification
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- PERSONA + PIN VIEW -->
                    <template x-if="view === 'persona'">
                        <div class="settings-view">
                            <div class="nb-toolbar">
                                <button class="nb-back" @click="view = personaUnlocked ? 'settings' : 'chat'">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                                </button>
                                <span class="nb-toolbar-title">Persona &amp; PIN</span>
                            </div>
                            <template x-if="!personaUnlocked">
                                <div class="pin-gate">
                                    <div class="pin-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
                                    <div class="pin-title" x-text="hasPin ? 'Enter PIN to unlock' : 'Set a PIN to protect persona settings'"></div>
                                    <div class="pin-dots">
                                        <template x-for="i in 6" :key="i"><span class="pin-dot" :class="{ filled: pinInput.length >= i }"></span></template>
                                    </div>
                                    <div class="pin-error" x-text="pinError"></div>
                                    <div class="pin-pad">
                                        <template x-for="n in [1,2,3,4,5,6,7,8,9]" :key="n"><button class="pin-key" @click="pinTap(n)" x-text="n"></button></template>
                                        <span></span>
                                        <button class="pin-key" @click="pinTap(0)">0</button>
                                        <button class="pin-key pin-key-wide" @click="pinBackspace()">⌫</button>
                                    </div>
                                    <button class="pin-forgot" x-show="hasPin" @click="forgotPin()">Forgot PIN?</button>
                                </div>
                            </template>
                            <template x-if="personaUnlocked">
                                <div class="settings-body">
                                    <template x-for="f in personaFieldDefs" :key="f.key">
                                        <div class="pfield">
                                            <label x-text="f.label"></label>
                                            <textarea rows="2" x-model="persona[f.key]"></textarea>
                                            <div class="hint" x-show="f.hint" x-text="f.hint"></div>
                                        </div>
                                    </template>
                                    <div class="pin-section-row">
                                        <span class="txt">🔒 <span x-text="hasPin ? 'Change PIN' : 'Set a PIN'"></span></span>
                                        <button class="btn-text" @click="startPinChange()">Change</button>
                                    </div>
                                    <div class="persona-actions">
                                        <button class="btn-text" @click="reloadPersona()">Cancel</button>
                                        <button class="btn btn-primary" @click="savePersonaNow()">
                                            <span x-text="personaSaved ? '✓ Saved' : 'Save persona'"></span>
                                        </button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                </aside>
            </div>

            <main class="content-area">

                <!-- Notebook overlay -->
                <template x-if="overlay==='notebook'">
                    <div class="modal-overlay" @click.self="overlay=null">
                        <div class="modal" x-data="notebookPage({ onClose: () => overlay=null })" style="max-width: 680px; width: 95%; max-height: 90vh; overflow-y: auto;">
                            <div class="section-header" style="margin-top: 0;">
                                <h1 style="font-size: 24px; margin: 0;">Notebook</h1>
                                <button class="btn-text" @click="close()">Close</button>
                            </div>
                            <div class="field-error" x-show="errorMsg" x-text="errorMsg"></div>
                            <template x-if="loading"><p>Loading…</p></template>
                            <template x-if="!loading">
                                <div class="stack">
                                    <div class="card workspace-section">
                                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--pad-sm);">
                                            <h2 x-text="window.formatDateDMY(todayDate)" style="margin: 0;"></h2>
                                            <span class="system-text" x-show="savedState === 'saved'" style="color: var(--accent-sage);">✓ Saved</span>
                                        </div>
                                        <div class="field">
                                            <textarea x-model="draft" rows="12" placeholder="What happened today?" @input="savedState = 'draft'"></textarea>
                                        </div>
                                        <button class="btn btn-primary" @click="save()" :disabled="savedState === 'saving'">
                                            <span x-text="savedState === 'saving' ? 'Saving...' : 'Save'"></span>
                                        </button>
                                    </div>
                                    <!-- Compact by default, expand in place on click (2026-07-31,
                                         Phase 2 -- mockup-approved). Every past entry used to render
                                         with its full body showing all the time -- a two-sentence
                                         entry from last week cost the same space as a long one, so
                                         the list read as sparse regardless of what was actually in
                                         it. Same interaction Atlas's own Project card already uses. -->
                                    <template x-if="pastEntries.length > 0">
                                        <div style="margin-top: var(--pad-lg);">
                                            <h3 class="system-text" style="margin-bottom: var(--pad-sm);">Previous entries</h3>
                                            <div class="stack" style="gap: 8px;">
                                                <template x-for="entry in pastEntries" :key="entry.id">
                                                    <div>
                                                        <template x-if="!isEntryExpanded(entry)">
                                                            <div class="note-row" @click="toggleEntry(entry)" role="button" tabindex="0" @keydown.enter.prevent="toggleEntry(entry)" @keydown.space.prevent="toggleEntry(entry)">
                                                                <span class="note-row-dot"></span>
                                                                <div class="note-row-body">
                                                                    <div class="note-date" x-text="window.formatDateDMY(entry.entry_date)"></div>
                                                                    <div class="note-row-preview" x-text="entryPreview(entry.body)"></div>
                                                                </div>
                                                                <svg class="note-row-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                                                            </div>
                                                        </template>
                                                        <template x-if="isEntryExpanded(entry)">
                                                            <div class="card note-entry">
                                                                <div class="note-entry-head" @click="toggleEntry(entry)" role="button" tabindex="0" @keydown.enter.prevent="toggleEntry(entry)">
                                                                    <div class="note-date" x-text="window.formatDateDMY(entry.entry_date)"></div>
                                                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
                                                                </div>
                                                                <p x-text="entry.body" style="white-space: pre-wrap;"></p>
                                                                <button class="btn-text" @click="deleteEntry(entry)">Delete</button>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>


                        </div>
                    </div>
                </template>

                <!-- Restore overlay -->
                <template x-if="overlay==='restore'">
                    <div class="modal-overlay" @click.self="overlay=null">
                        <div class="modal" x-data="restorePage({ onClose: () => overlay=null })" style="max-width: 680px; width: 95%; max-height: 90vh; overflow-y: auto;">
                            <div class="section-header" style="margin-top: 0;">
                                <h1 style="font-size: 24px; margin: 0;">Restore</h1>
                                <button class="btn-text" @click="close()">Close</button>
                            </div>
                        <p class="project-focus">Anything you deleted lives here. Restore brings it back; Delete forever cannot be undone.</p>
                        <div class="field-error" x-show="errorMsg" x-text="errorMsg"></div>
                        <template x-if="loading"><p>Loading…</p></template>
                        <template x-if="!loading">
                            <div class="stack">
                                <template x-for="section in sections" :key="section.key">
                                    <div class="card workspace-section">
                                        <button class="log-date-header" @click="toggleSection(section)" style="width:100%;">
                                            <span x-text="`${section.label}: ${section.items.length}`"></span>
                                            <span x-text="section.expanded ? '−' : '+'"></span>
                                        </button>
                                        <template x-if="section.expanded && section.items.length === 0">
                                            <p class="project-focus" style="margin-top: var(--pad-sm);">Nothing here.</p>
                                        </template>
                                        <template x-if="section.expanded && section.items.length > 0">
                                            <div style="margin-top: var(--pad-sm);">
                                                <template x-for="row in section.items" :key="row.id">
                                                    <div class="restore-row card-nested">
                                                        <span x-text="labelOf(section, row)"></span>
                                                        <div class="restore-row-actions">
                                                            <button class="btn-text" @click="restoreRow(section, row)">Restore</button>
                                                            <button class="btn-text" style="color: var(--accent-coral)" @click="askHardDeleteRow(section, row)">Delete forever</button>
                                                        </div>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>
                        <!-- Delete Confirmation Modal handled inside Restore Overlay is already fine, wait, modal in modal might conflict if nested modal-overlay is used, but z-index handles it -->
                        <template x-if="confirmingHardDelete">
                            <div class="modal-overlay" style="z-index: 200;" @click.self="cancelHardDelete()">
                                <div class="modal">
                                    <h2>Delete forever?</h2>
                                    <p class="project-focus">This permanently removes "<span x-text="confirmingHardDelete.label"></span>" — it cannot be undone.</p>
                                    <div class="modal-actions">
                                        <button class="btn-text" @click="cancelHardDelete()">Cancel</button>
                                        <button class="btn btn-danger" @click="confirmHardDelete()">Delete forever</button>
                                    </div>
                                </div>
                            </div>
                        </template>
                        </div>
                    </div>
                </template>

                <!-- Snooze picker (2026-08-06) -- global, not owned by any
                     one page's x-data, since a push notification's Snooze
                     tap can land regardless of which tab is open. See
                     app()'s snoozePickerOpen/chooseSnooze() in main.js and
                     push-client.js's atlas:snooze-request event. -->
                <template x-if="snoozePickerOpen">
                    <div class="modal-overlay" @click.self="closeSnoozePicker()">
                        <div class="modal" style="max-width: 320px;">
                            <h2 style="margin: 0 0 4px; font-size: 16px;">Snooze for</h2>
                            <p style="color: var(--text-muted); font-size: 12px; margin: 0 0 14px;">Pick how long to push this back.</p>
                            <div class="snooze-opts">
                                <button type="button" class="snooze-opt" @click="chooseSnooze(15)"><span class="n">15</span><span class="u">min</span></button>
                                <button type="button" class="snooze-opt" @click="chooseSnooze(30)"><span class="n">30</span><span class="u">min</span></button>
                                <button type="button" class="snooze-opt" @click="chooseSnooze(60)"><span class="n">1</span><span class="u">hour</span></button>
                            </div>
                            <div class="field-error" x-show="snoozeError" x-text="snoozeError" style="margin-top: 10px; margin-bottom: 0;"></div>
                            <div class="modal-actions">
                                <button class="btn-text" @click="closeSnoozePicker()">Cancel</button>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Today tab -->
                <template x-if="tab==='today'">
                    <div x-data="todayPage({ onOpenProject: (id) => { tab = 'projects'; openProject(id); } })">
                        <div class="section-header">
                            <!-- Today title block: H1 above its own date, so the page title
                                 clearly outranks the top-nav tabs (Today / Projects). Replaces
                                 the old H1 + separate <p class="sub"> below. -->
                            <div class="today-block">
                                <h1>Today</h1>
                                <div class="today-date" x-text="todayLabel"></div>
                            </div>
                            <button class="icon-button journal-btn" :class="{active: journalOpen}" @click="journalOpen = !journalOpen" aria-label="Log an emotion or thought about today" style="display:none">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                                <span class="tooltip">Log an emotion or thought about today</span>
                            </button>
                        </div>
                        <template x-if="journalOpen">
                            <div class="card panel" style="margin-bottom: var(--pad-md);">
                                <div class="field"><textarea x-model="journalDraft" rows="3" placeholder="Log a thought, feeling, or reflection about today…" autofocus></textarea></div>
                                <button class="btn btn-primary" @click="saveJournal()" :disabled="journalSaving">Save journal</button>
                            </div>
                        </template>
                        <div class="field-error" x-show="errorMsg" x-text="errorMsg"></div>
                        <template x-if="loading"><p>Loading…</p></template>
                        <template x-if="!loading">
                            <div class="stack">


                                <!-- Hero band: streaks flank the KPI strip -->
                                <div class="hero-band">
                                    <template x-if="streaks[0]">
                                        <div class="card streak-card" :class="'color-' + streaks[0].color_key">
                                            <div class="streak-num" x-text="daysFor(streaks[0])"></div>
                                            <div class="streak-unit">days</div>
                                            <div class="streak-label" x-text="streaks[0].name"></div>
                                            <template x-if="streakMeta(streaks[0])">
                                                <div class="streak-meta" :class="{grace: streakMeta(streaks[0]).grace}" x-text="streakMeta(streaks[0]).text"></div>
                                            </template>
                                            <button class="streak-action relapse" @click="openRelapseModal(streaks[0])">relapse</button>
                                        </div>
                                    </template>

                                    <div class="kpi-strip">
                                        <div class="card kpi-card">
                                            <div class="kpi-top">
                                                <div class="kpi-icon blue"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div>
                                                <div style="text-align:right;"><div class="kpi-num-lg"><span x-text="recentlyCompleted.length"></span><span class="denom" x-text="'/' + tasksTodayTotal"></span></div><div class="kpi-label">Tasks today</div></div>
                                            </div>
                                            <div class="kpi-dot-row">
                                                <template x-for="(t, i) in upcomingTasks.slice(0,5)" :key="t.id"><span class="kpi-dot on"></span></template>
                                                <template x-for="i in Math.max(0, 5 - upcomingTasks.length)" :key="'e'+i"><span class="kpi-dot"></span></template>
                                            </div>
                                            <template x-if="upcomingTasks[0]">
                                                <div class="kpi-next"><span><span class="lbl">Next up</span><span x-text="upcomingTasks[0].name"></span></span><span style="color:var(--text-muted);" x-text="upcomingTasks[0].scheduled_time ? window.formatTime12h(upcomingTasks[0].scheduled_time) : ''"></span></div>
                                            </template>
                                        </div>

                                        <div class="card kpi-card">
                                            <div class="kpi-top">
                                                <div class="kpi-icon lilac"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg></div>
                                                <div style="text-align:right;"><div class="kpi-num-lg" x-text="activeProjectCount"></div><div class="kpi-label">Active projects</div></div>
                                            </div>
                                            <div class="kpi-proj-list">
                                                <template x-for="p in projects.slice(0,3)" :key="p.id">
                                                    <div class="kpi-proj-row"><span class="kpi-proj-chip" :class="'color-' + p.color_key" x-text="projectInitial(p)"></span><span x-text="p.name"></span></div>
                                                </template>
                                                <template x-if="projects.length === 0"><p class="project-focus" style="margin:0;">No active projects.</p></template>
                                            </div>
                                        </div>

                                        <div class="card kpi-card hero">
                                            <div class="kpi-label" style="align-self:flex-start;">Checklist today</div>
                                            <!-- Ring auto-scales to its .kpi-ring-wrap size (128px) via
                                                 the SVG width:100%/height:100% rule in components.css; the
                                                 viewBox stays 100x100 so the stroke-dasharray maths still
                                                 works. Don't hardcode width/height here. -->
                                            <div class="kpi-ring-wrap">
                                                <svg viewBox="0 0 100 100">
                                                    <circle cx="50" cy="50" r="42" fill="none" stroke="var(--surface-2)" stroke-width="10"/>
                                                    <!-- Layer 2 = done+skipped combined arc. Amber is Atlas's
                                                         skipped color across the whole app (trend chart legend +
                                                         checklist mini-dots), so the visible "skipped" segment in
                                                         the ring now matches those. Was --border-hover, which was
                                                         essentially invisible against --surface-2 (Abhishek's
                                                         direct feedback, 2026-07-26). -->
                                                    <circle cx="50" cy="50" r="42" fill="none" stroke="var(--accent-amber)" stroke-width="10" stroke-linecap="round" stroke-dasharray="264" :stroke-dashoffset="checklistTotalToday ? (264 - (264 * (checklistDoneToday + checklistSkippedToday) / checklistTotalToday)) : 264"/>
                                                    <circle cx="50" cy="50" r="42" fill="none" stroke="var(--accent-sage)" stroke-width="10" stroke-linecap="round" stroke-dasharray="264" :stroke-dashoffset="checklistTotalToday ? (264 - (264 * checklistDoneToday / checklistTotalToday)) : 264"/>
                                                </svg>
                                                <div class="kpi-ring-num"><span class="n" x-text="`${checklistDoneToday}/${checklistTotalToday}`"></span><span class="d" x-text="checklistPct + '%'"></span></div>
                                            </div>
                                            <div class="kpi-label">
                                                <span x-text="checklistRemaining + (checklistRemaining === 1 ? ' item left today' : ' items left today')"></span>
                                                <template x-if="checklistSkippedToday > 0">
                                                    <span style="margin-left: 6px;">
                                                        <span class="trend-dot trend-skipped" style="width:8px;height:8px;margin-right:4px;"></span>
                                                        <span x-text="checklistSkippedToday + (checklistSkippedToday === 1 ? ' skipped' : ' skipped')"></span>
                                                    </span>
                                                </template>
                                            </div>
                                        </div>
                                    </div>

                                    <template x-if="streaks[1]">
                                        <div class="card streak-card" :class="'color-' + streaks[1].color_key">
                                            <div class="streak-num" x-text="daysFor(streaks[1])"></div>
                                            <div class="streak-unit">days</div>
                                            <div class="streak-label" x-text="streaks[1].name"></div>
                                            <template x-if="streakMeta(streaks[1])">
                                                <div class="streak-meta" :class="{grace: streakMeta(streaks[1]).grace}" x-text="streakMeta(streaks[1]).text"></div>
                                            </template>
                                            <button class="streak-action relapse" @click="openRelapseModal(streaks[1])">relapse</button>
                                        </div>
                                    </template>
                                </div>

                                <!-- Tasks & Reminders (Option 2, 2026-07-29): split into Active
                                     (65%) and Completed today (35%), instead of one full-width
                                     card with completed items sharing scroll space with active
                                     ones. Same grid-with-gap pattern the Health row already uses
                                     for Sleep/Workout, just a 65/35 ratio instead of 50/50. -->
                                <div class="tasks-row">
                                <div class="card panel">
                                        <div class="panel-head">
                                            <h2 style="margin:0;">Tasks &amp; Reminders</h2>
                                            <div class="panel-head-actions">
                                                <!-- Upcoming (Phase 6, moved to header 2026-07-28): today's own
                                                     list/filter never widens -- this is the one place future-dated
                                                     tasks/reminders are visible and manageable without leaving
                                                     Today. Secondary action, sits quiet next to +Add task. -->
                                                <button class="btn-text" x-show="futureTasks.length > 0" @click="openUpcomingModal()">View more<span x-text="' (' + futureTasks.length + ')'"></span></button>
                                                <button class="add-btn" @click="openTaskModal()">+ Add task</button>
                                            </div>
                                        </div>
                                        <div class="task-list" style="max-height: 260px;">
                                            <!-- Empty state: three pulsing dots + one headline + one line of
                                                 helper copy. Mature, no cartoon. Animation collapses under
                                                 prefers-reduced-motion via tokens.css's global override. Only
                                                 depends on the active list now -- completed items have their
                                                 own card and no longer factor into whether this looks empty. -->
                                            <template x-if="upcomingTasks.length === 0">
                                                <div class="empty-tasks">
                                                    <div class="empty-cue-tasks">
                                                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                            <path d="M20 6L9 17l-5-5"/>
                                                        </svg>
                                                    </div>
                                                    <div class="headline">Nothing scheduled today</div>
                                                    <div class="help">Add a task above, or check the Routine section below for what's next.</div>
                                                </div>
                                            </template>
                                            <template x-for="task in upcomingTasks" :key="task.id">
                                                <div class="trv2-row" :class="{ 'is-overdue': isOverdue(task), 'is-done': task.status==='done' }" @click="openTaskEditModal(task)" role="button" tabindex="0" @keydown.enter.prevent="openTaskEditModal(task)" @keydown.space.prevent="openTaskEditModal(task)" :aria-label="'Edit ' + (task.kind==='reminder' ? 'reminder' : 'task') + ': ' + task.name" style="grid-template-columns: auto minmax(0, 1fr) auto;">
                                                    <div style="display: flex; gap: 6px; align-items: center;">
                                                        <button class="trv2-check" :class="{ 'is-pending': isPendingComplete(task) }" @click.stop="handleCompleteClick(task)" :aria-label="isPendingComplete(task) ? ('Confirm mark ' + task.name + ' done') : ('Mark ' + task.name + ' done')" :title="isPendingComplete(task) ? 'Tap again to confirm' : 'Mark done'">
                                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                                                        </button>

                                                    </div>
                                                    <div class="trv2-body" style="min-width: 0;">
                                                        <div style="display: flex; align-items: center; gap: 6px;">
                                                            <div class="trv2-name" x-text="task.name"></div>
                                                            <template x-if="task.priority==='high'"><span class="priority-badge high"><span class="dot"></span>High</span></template>
                                                        </div>
                                                        <div class="trv2-meta" style="display: flex; align-items: center; flex-wrap: nowrap; overflow: hidden;">
                                                            <template x-if="task.kind==='reminder'">
                                                                <span class="trv2-kind reminder" style="flex-shrink: 0; margin-right: 6px;">
                                                                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                                                                    Reminder
                                                                </span>
                                                            </template>
                                                            <template x-if="task.kind!=='reminder'">
                                                                <span class="trv2-kind task" x-text="projectFor(task) ? 'Task' : 'Task · Standalone'" style="flex-shrink: 0; margin-right: 6px;"></span>
                                                            </template>
                                                            <template x-if="projectFor(task)">
                                                                <span class="trv2-project clickable" :class="'color-' + projectFor(task).color_key" style="flex-shrink: 0; margin-right: 6px;" @click.stop="goToProject(projectFor(task).id)" role="button" tabindex="0" :title="'Open ' + projectFor(task).name" @keydown.enter.stop.prevent="goToProject(projectFor(task).id)">
                                                                    <span class="id-chip" :class="'color-' + projectFor(task).color_key" x-text="projectInitial(projectFor(task))"></span>
                                                                    <span x-text="projectFor(task).name"></span>
                                                                </span>
                                                            </template>
                                                            <template x-if="isPendingComplete(task)">
                                                                <span class="trv2-confirm-hint" style="flex-shrink: 0; margin-right: 6px;">Tap ✓ again to confirm</span>
                                                            </template>
                                                            <!-- Paused tag (2026-07-31 correction round 2) -- reuses
                                                                 the exact same neutral .task-edit-status pill the
                                                                 Project workspace already shows for a paused task
                                                                 (background: --surface-2, text: --text-secondary --
                                                                 calm/muted, never coral), so a paused task in this
                                                                 list reads clearly as Paused and can never be
                                                                 mistaken for overdue. -->
                                                            <template x-if="task.status === 'paused'">
                                                                <span class="task-edit-status" style="flex-shrink: 0; margin-right: 6px;">Paused</span>
                                                            </template>
                                                            <template x-if="task.status === 'paused' && task.running_note">
                                                                <span class="trv2-pause-reason" x-text="task.running_note" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 0; padding-top: 0; border: none; background: transparent; padding-left: 0; color: var(--text-secondary); font-size: 13px;"></span>
                                                            </template>
                                                        </div>
                                                    </div>
                                                    <div class="trv2-time-col" style="flex-direction: row; align-items: center; gap: 8px;">
                                                        <div style="display: flex; flex-direction: column; align-items: flex-end;">
                                                            <template x-if="task.scheduled_date || task.scheduled_time">
                                                                <div class="trv2-time" :class="{ overdue: isOverdue(task) }" x-text="window.formatTaskDateTime(task.scheduled_date, task.scheduled_time)"></div>
                                                            </template>
                                                            <template x-if="isOverdue(task)">
                                                                <div class="trv2-time-tag">Overdue</div>
                                                            </template>
                                                        </div>
                                                        <template x-if="task.project_id && task.status !== 'in_progress' && task.status !== 'done'">
                                                            <button style="color: var(--text-tertiary); background: transparent; border: none; padding: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; outline: none; opacity: 0.8;" @click.stop="startTaskOnToday(task)" title="Start task" aria-label="Start task" onmouseover="this.style.opacity='1'; this.style.color='var(--accent-blue)'" onmouseout="this.style.opacity='0.8'; this.style.color='var(--text-tertiary)'">
                                                                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="6 3 20 12 6 21 6 3"/></svg>
                                                            </button>
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                </div>

                                <!-- Today's activity: its own quiet card, not sharing scroll space
                                     with the active list anymore. Lighter row style than .trv2-row
                                     on purpose (16px filled icon, no chip, no kind label) so this
                                     reads as a glance, not a second task list.
                                     Extended 2026-07-31 (correction pass, Option B) -- a running
                                     task used to have no distinct home at all; it just sat in the
                                     ordinary Active list looking identical to a not-started task.
                                     "Running now" is a new top section here, reusing runningTasks
                                     (same plural .filter() pattern already proven in the Project
                                     workspace) -- absent entirely when nothing's running, same
                                     no-empty-state convention that section already uses there.
                                     "Completed today" below is unchanged, still recentlyCompleted,
                                     no new query. -->
                                <div class="card panel completed-today-card">
                                        <div class="panel-head" style="margin-bottom: 12px;">
                                            <h2 style="margin:0; font-size: 14px;">Today's activity</h2>
                                        </div>
                                        <template x-if="runningTasks.length > 0">
                                            <div class="mini-section">
                                                <div class="mini-section-label">Running now</div>
                                                <div class="mini-task-list">
                                                    <template x-for="task in runningTasks" :key="task.id">
                                                        <div class="trv2-row" :class="{ 'is-overdue': isOverdue(task) }" @click="openTaskEditModal(task)" role="button" tabindex="0" @keydown.enter.prevent="openTaskEditModal(task)" @keydown.space.prevent="openTaskEditModal(task)" :aria-label="'Edit running task: ' + task.name" style="grid-template-columns: auto minmax(0, 1fr) auto; padding-left: 0; padding-right: 0; background: transparent; box-shadow: none; border-bottom: 1px solid var(--border);">
                                                            <button class="trv2-check" :class="{ 'is-pending': isPendingComplete(task) }" @click.stop="handleCompleteClick(task)" :aria-label="isPendingComplete(task) ? ('Confirm mark ' + task.name + ' done') : ('Mark ' + task.name + ' done')" :title="isPendingComplete(task) ? 'Tap again to confirm' : 'Mark done'">
                                                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                                                            </button>
                                                            <div class="trv2-body" style="min-width: 0;">
                                                                <div style="display: flex; align-items: center; gap: 6px;">
                                                                    <div class="trv2-name" style="color: var(--text-primary); font-weight: 500;" x-text="task.name"></div>
                                                                    <template x-if="task.priority==='high'"><span class="priority-badge high"><span class="dot"></span>High</span></template>
                                                                </div>
                                                                <div class="trv2-meta" style="display: flex; align-items: center; flex-wrap: nowrap; overflow: hidden;">
                                                                    <template x-if="projectFor(task)">
                                                                        <span class="trv2-project clickable" :class="'color-' + projectFor(task).color_key" style="flex-shrink: 0; margin-right: 6px;" @click.stop="goToProject(projectFor(task).id)" role="button" tabindex="0" :title="'Open ' + projectFor(task).name" @keydown.enter.stop.prevent="goToProject(projectFor(task).id)">
                                                                            <span class="id-chip" :class="'color-' + projectFor(task).color_key" x-text="projectInitial(projectFor(task))"></span>
                                                                            <span x-text="projectFor(task).name"></span>
                                                                        </span>
                                                                    </template>
                                                                    <template x-if="isPendingComplete(task)">
                                                                        <span class="trv2-confirm-hint" style="flex-shrink: 0; margin-right: 6px;">Tap again to confirm</span>
                                                                    </template>
                                                                    <span class="task-edit-status" style="flex-shrink: 0; margin-right: 6px; background: var(--accent-sage-bg); color: var(--accent-sage);">Running</span>
                                                                </div>
                                                            </div>
                                                            <div class="trv2-time-col">
                                                                <template x-if="task.scheduled_date || task.scheduled_time">
                                                                    <div class="trv2-time" :class="{ overdue: isOverdue(task) }" x-text="window.formatTaskDateTime(task.scheduled_date, task.scheduled_time)"></div>
                                                                </template>
                                                                <template x-if="isOverdue(task)">
                                                                    <div class="trv2-time-tag">Overdue</div>
                                                                </template>
                                                            </div>
                                                        </div>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                        <div class="mini-section" :class="{ 'mini-section-spaced': runningTasks.length > 0 }">
                                        <div class="mini-section-label" x-show="runningTasks.length > 0 || recentlyCompleted.length > 0">Completed today</div>
                                        <template x-if="recentlyCompleted.length > 0">
                                            <div class="mini-task-list">
                                                <template x-for="task in recentlyCompleted" :key="task.id">
                                                    <div class="mini-task-row">
                                                        <span class="mini-task-check">
                                                            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                                                        </span>
                                                        <span class="mini-task-name" x-text="task.name"></span>
                                                        <span class="mini-task-time" x-text="task.completed_at ? window.formatTime12h(task.completed_at.slice(11,16)) : ''"></span>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>

                                        </div>
                                </div>
                                </div>

                                <!-- Health row: Sleep | Workout, equal height via grid stretch -->
                                <div class="health-row">
                                        <div class="card health-panel tint-sage">
                                            <div class="health-panel-head">
                                                <div class="health-panel-title">
                                                    <span class="health-panel-icon sage">
                                                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                                                    </span>
                                                    <h2>Sleep</h2>
                                                </div>
                                                <div class="health-panel-actions">
                                                    <button class="btn-icon-sm" x-show="sleepEntry" @click="deleteSleepEntry()" title="Delete sleep log" style="color:var(--accent-coral)">
                                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
                                                    </button>
                                                    <button class="health-edit-btn" @click="openSleepModal()" x-text="sleepEntry ? 'Edit' : 'Log sleep'"></button>
                                                </div>
                                            </div>
                                            <template x-if="!hasSleepData">
                                                <div class="sleep-empty">
                                                    <svg class="sleep-empty-art" width="76" height="76" viewBox="0 0 80 80" fill="none" aria-hidden="true">
                                                        <circle cx="40" cy="44" r="28" fill="var(--accent-sage-tint)"/>
                                                        <rect x="14" y="38" width="52" height="22" rx="5" fill="var(--surface-2)" stroke="var(--border-hover)" stroke-width="1.4"/>
                                                        <rect x="18" y="42" width="14" height="10" rx="3" fill="var(--surface-1)" stroke="var(--border-hover)" stroke-width="1"/>
                                                        <ellipse cx="25" cy="40" rx="5" ry="4.5" fill="var(--surface-1)" stroke="var(--border-hover)" stroke-width="1"/>
                                                        <line x1="36" y1="48" x2="56" y2="48" stroke="var(--border-hover)" stroke-width="1.2" stroke-linecap="round"/>
                                                        <line x1="36" y1="52" x2="50" y2="52" stroke="var(--border-hover)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
                                                        <path d="M58 28a6.5 6.5 0 1 1-5.6 3.2A4.8 4.8 0 0 0 58 28z" fill="var(--accent-sage)" opacity="0.4"/>
                                                        <text x="60" y="22" font-family="var(--font-mono)" font-size="11" font-weight="600" font-style="italic" fill="var(--accent-sage)" opacity="0.5">z</text>
                                                        <text x="65" y="16" font-family="var(--font-mono)" font-size="13" font-weight="600" font-style="italic" fill="var(--accent-sage)" opacity="0.35">z</text>
                                                    </svg>
                                                    <div class="h">No sleep logged today</div>
                                                    <div class="p">Log manually or use voice.</div>
